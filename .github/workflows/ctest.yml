name: CTest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Not recursive: OSLO's one nested submodule is SUNDIALS, which only
          # USE_SUNDIALS needs.
          submodules: true

      - name: Install system dependencies
        # numpy, scipy and matplotlib: the checkers of some tests import them, where those tests exist (the scipy
        # oracle of the boiling-zgr cases, the V&V figures that vv-order draws with numpy and matplotlib).
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran python3-numpy python3-scipy python3-matplotlib

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=RELEASE \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_CXX_COMPILER=g++ \
            -DUSE_OPENMP=ON \
            -DUSE_MPI=OFF \
            -DUSE_TECIO=OFF \
            -DUSE_SUNDIALS=OFF \
            -DBUILD_VERIFICATION=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run the test suite
        # The whole suite (tests/test.sh all): every category, unit and end-to-end, in parallel on the runner's cores.
        # vortex-cloud-3way is skipped without hydra and ICE; the mpi cases exist only with USE_MPI=ON.
        run: >
          ctest --test-dir build
          --output-on-failure
          --timeout 900
          --parallel $(nproc)
