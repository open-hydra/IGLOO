; E-VAL-3: Tonini-Cossali evaporation reproducing TC2012 Fig. 11 -- an n-hexadecane
; drop (R_d0=10um, T_d0=300K) in vapour-free air at 600K. Same box and injection as
; tc-box (kv=1 gives Re=0, Sh=2, coast at u_g, t=x/u_g; kt=0.5 gives 300K; d0=20um),
; but a REAL fuel with temperature-dependent liquid density (INPUT/properties.dat),
; so the drop swells while heating before the D2-law evaporation. Evaporation=TC,
; interface=VLE. The TC rate is the tight gate (check.py); the digitized TC2012 Fig.11
; curves are a non-gating overlay (verify.py). n-hexadecane properties: Mv, Tboil from
; TC2012 Table 1; psat(T) = TC2012's own Table-1 curve, the Psat column of
; INPUT/properties.dat (piecewise Clausius-Clapeyron through its anchors, see
; reference/PROVENANCE.md); Lv=2.2695e5 = Table 1's latent heat at the boiling point,
; the energy sink only; liquid cp_l=2800 (properties.dat) = NIST/Chemeo n-hexadecane
; liquid Cp at ~490K.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = TC
interface   = VLE

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.2695e5
Mv    = 226.45
Tboil = 560.0
cpv   = 2300.0
Le    = 2.5
Yinf  = 0.0
psat  = 1.0e4

[GPB-Phase1]
type    = condensed-dispersed
rho     = 8000
cp      = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 20.0e-6

[wall]
type = wall
q    = 0.0

