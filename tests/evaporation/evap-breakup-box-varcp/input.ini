; evap-breakup-box-varcp: the evap-breakup-box case (ODE model 4, Reitz-Diwakar breakup with d2-law evaporation,
; every drop consumed inside the box) with a heat capacity that varies with temperature. INPUT/properties.dat
; (make_table.py) holds cp 1250 + (T - 300) J/(kg K) on 1..1000 K, density 2950, the enthalpy its trapezoid sum.
; 25 identical 30 um drops at 40 m/s and 300 K in a 50 m/s, 600 K gas. The particle state is the enthalpy, the
; latent term enters its rate with no heat-capacity factor, the temperature comes back through the table and the
; gas receives each segment's energy at the table's enthalpy. out-time writes the parcel time on every row.
; check.py: the energy handed to the gas telescopes, evap-breakup-box's mass audit, and the temperature follows
; the enthalpy history along the measured path.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-10
absolute-tol = 1e-10

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
evaporation = d2-law
breakup     = Reitz-Diawakar

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma               = 6.0e-5
mu                  = 1.0e-3
Lv                  = 2.0e5
Mv                  = 100.0
boiling-temperature = 900.0
cpv                 = 2000.0
Le                  = 1.0
Yinf                = 0.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
