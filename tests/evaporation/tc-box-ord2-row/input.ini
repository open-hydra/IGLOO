; tc-box-ord2-row: the ord2 sibling of tc-box, with the parcels INSIDE a boundary dual row.
;
; Gates the conservation of the gas-order = 2 source reduction end to end. Under ord2 the
; source accumulators live on the dual mesh and obj_sourceblock%finalize reduces them to geo
; cells; before O28 that reduction volume-AVERAGED extensive rates, so a boundary dual row
; handed on only half its deposit. Nothing in the suite could see it: every telescoping gate
; ran at gas-order = 1, and the one ord2 source gate (swirl-wedge-deposit) never entered a
; boundary row except the outlet and is blind by magnitude (its bands were 0.14 % off, inside
; a 2 % tolerance).
;
; Four changes from tc-box's input.ini, all load-bearing:
;   gas-order = 2   -> the dual mesh and finalizeSRC's reduction are what is under test
;   mollify   = off -> the smoother is conservative but spreads the boundary row 60+ cells
;                      inward, which would hide WHERE the mass went
;   [IGLOO-BC] DB injection instead of `ds` -> places the parcels by coordinate, so they can
;                      be put in the j = 1 dual row on purpose
;   INPUT/bc.txt    -> written by make_fixture.py, every face 100 (no 401 inlet)
;
; Placement (box 60x5x5 over x[0,0.15] y,z[0,0.05]: dx = 2.5 mm, dy = dz = 10 mm; dual nodes
; sit at the geo cell centres 5, 15, 25, 35, 45 mm):
;   y = 2 mm    -> dual row j = 1 = [0, 5] mm, a FACE row: this is the row that leaked
;   z = 12/22/32/42 mm -> dual k = 2..5, interior, so only ONE index is a boundary
;   x = 5.5 mm  -> dual i = 3 and inside geo cell 3. NOT 5.0 mm, which is a geo node plane:
;                  a point on a shared face plane is inside both neighbours to within
;                  isPointInsideHexahedron12's absolute eps, and which cell wins is decided
;                  by search order, not geometry.
; kv = 1 in effect (up = u_g = 10, v = w = 0) so there is zero slip and no body force: the
; whole path stays in row j = 1 and exits through face 2.
;
; No temp0 key => 0 => the droplet starts at the local gas temperature (600 K) rather than
; tc-box's kt = 0.5 (300 K). This is NOT tc-box's thermal regime: the drops start at the gas
; temperature and cool to the ~536 K wet bulb.
;
; mdot = 6.18e-4 kg/s per stream => npdot = 6.18e-4 / 1.2357e-11 = 5.0e7 1/s, the same
; number flow as one tc-box inlet cell (rho_p = 2950 from properties.dat, d = 20 um).
;
; Everything below is tc-box's own header and case; the evaporation physics is gated there.
;
; IGLOO end-to-end verification: TONINI-COSSALI ANALYTICAL EVAPORATION (F2)
; on an AXIS-ALIGNED BOX.
;
; Companion to evaporation/lk-neq. Same uniform-gas box (tools/make_box_case.py) and
; regime, but the gas-side model is TC (Tonini-Cossali 2012, via Antonov et al. 2024
; eq.9; interface = VLE). TC replaces CEM's mass-fraction Spalding closure with the
; variable-density molar Stefan-Fuchs rate:
;   rhs0 = (Mv/Minf)*ln[(1-Xinf)/(1-Xs)]     (molar driver, Xs from psat)
;   m + (Ts/Tg - 1)*Lev*(f(m/Lev)-1) = rhs0, f(x)=x/(1-e^-x)   (solved for m)
;   mdot = -pi*d*rho*Dv*Sh*m,  Sh=2 at Re=0                (Ranz-Marshall bolt-on)
; kV=1 (v0=u_g => Re=0 => Sh=2, particle coasts at u_g) gives the clean x = u_g*t
; mapping; check.py bisection-solves the TC transcendental along the MEASURED Tp(x)
; with RK4 and compares predicted d^2(x).
;
; Regime (heavy fuel Mv=100 >> Mg=28.97 for a strong molar-vs-mass split; Lv=1e6 so the
; drop reaches a clean wet-bulb ~536 K, BELOW Tg=600 K, and coasts there -- no thermal
; runaway, ~23% d^2 loss over the residence). TC exceeds CEM by several % along the path,
; ~4-5 orders above the E13.6 truncation band -> the case CATCHES a silent CEM regression.
; Yinf=0 opens the Spalding gate; Tboil=600 K keeps psat<p (no boiling clamp).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = TC
interface   = VLE

[IGLOO-BC]
x    = 0.0055 0.0055 0.0055 0.0055
y    = 0.002 0.002 0.002 0.002
z    = 0.012 0.022 0.032 0.042
diam = 20.0e-6 20.0e-6 20.0e-6 20.0e-6
mdot = 6.18e-4 6.18e-4 6.18e-4 6.18e-4
up   = 10.0 10.0 10.0 10.0
vp   = 0.0 0.0 0.0 0.0
wp   = 0.0 0.0 0.0 0.0

[IGLOO-Properties]
Lv    = 1.0e6
Mv    = 100.0
Tboil = 600.0
cpv   = 2000.0
Le    = 1.0
Yinf  = 0.0
psat  = 1.0e4

[GPB-Phase1]
type    = condensed-dispersed
rho     = 8000
cp      = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 20.0e-6

[wall]
type = wall
q    = 0.0

