; IGLOO end-to-end verification: EVAPORATION (d2-law mass loss) on an AXIS-ALIGNED BOX.
;
; Companion to drag-stokes / temp-relax. Same uniform-gas box (tools/make_box_case.py).
; Goal: verify the production evaporative MASS-LOSS RATE against the literature
; d2-law (Godsave 1953 / Spalding 1954) rate kernel:
;   mdot = -pi*d*kg/cp_g*ln(1+BT),  BT = cp_g*(Tg-Tp)/Lv   [Lib_Evaporation::d2law]
; In d(d^2)/dt form (m = rho_p*(pi/6)*d^3):
;   d(d^2)/dt = -4*kg/(cp_g*rho_p) * ln(1 + BT)
; The d2-law rate depends on Re only through the stagnant-film Sh=Nu=2 assumption, so
; it is independent of slip; we still set kV=1 (=> v0=u_g => Re=0 => particle coasts at
; u_g, pure +x) ONLY to get a clean x = u_g*t mapping so check.py can integrate dt=dx/u_g.
;
; The particle TEMPERATURE Tp is coupled (model 2 evolves Z(7) via interphase heating +
; a latent enthalpy sink), so BT drifts in time -> K is NOT constant. check.py therefore
; does NOT model Tp: it reads the MEASURED Tp(x) from the trajectory and integrates the
; literature rate kernel along it, comparing the predicted d^2(x) to the measured d^2
; (col 8). Scope: this verifies the EVAPORATIVE MASS-RATE LAW given the temperature
; history; the temperature evolution itself is out of scope (see report-verification.md).
;
; Regime (tuned for a clean, non-vacuous test): dense 30 um droplet (rho_p=8000) gives a
; long thermal time tau_T = cp_p*rho_p*d^2/(12*kg) ~ 0.03 s >> ... so Tp drifts slowly over
; the 0.015 s residence -> near-steady evaporation, slow Tp drift (accurate trapezoid),
; and ~15% d^2 loss across the domain (high S/N vs the 6-sig-fig E13.6 diameter output).
; Droplet survives to the outlet. Yinf=0 (dry ambient) so the Spalding Ys>Yinf gate always
; opens; Tboil=900 K keeps psat<p (no boiling clamp) over the whole Tp range.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = d2-law

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.0e5
Mv    = 100.0
Tboil = 900.0
cpv   = 2000.0
Le    = 1.0
Yinf  = 0.0
psat  = 1.0e4

[GPB-Phase1]
type = condensed-dispersed
rho  = 8000
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0

