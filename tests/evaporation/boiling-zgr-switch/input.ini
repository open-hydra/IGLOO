; IGLOO end-to-end verification: the REGIME SWITCH of a boiling water drop (boiling ZGR) into evaporation.
;
; boiling-zgr-flash with the gas at 1 m/s and d0 20e-6 m: the drop flashes in the boiling branch until its mean
; temperature reaches the boiling temperature at the gas pressure (600 K), then cools in the classical model and
; is consumed inside the box. check.py: T(x) and m(x) against the two branches integrated with scipy, switched at
; T_B (tools/zgr_oracle.py), rows on both sides of T_B, every parcel burnt out. INPUT/bc.txt and solfile.tec from
; make_fixture.py; properties.dat is boiling-zgr-flash's. The absolute ODE tolerance is 1e-22, below the mass
; (4e-12 kg at injection, 1e-15 at burnout), so the integrator controls the mass relatively to the burnout; with
; 1e-11 the mass of the last rows strays by up to 1.4 percent, and below 1e-26 the step across the switch at T_B
; falls under the integrator floor (Run_ODESolver err).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-22

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
boiling     = ZGR

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv                  = 2.26e6
Mv                  = 18.0
boiling-temperature = 551.7783324
cpv                 = 1900.0
Le                  = 1.0
Yinf                = 0.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 958
cp   = 4186

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 20.0e-6

[wall]
type = wall
q    = 0.0
