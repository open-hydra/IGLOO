; mhb98-water-psat: the water droplet of evaporation/mhb98-water (D0=1.1mm, Td0=282K, TG=298K,
; Re_d=0, CEM + Langmuir-Knudsen) with p_sat taken from the Psat column of INPUT/properties.dat
; instead of Clausius-Clapeyron. INPUT/properties.dat is the table ATLAS GPB writes for water with
; psat-vapour = H2O (its test CP-psat-water, byte for byte): cp 4184, rho 997 (the case's own
; values), T 280..380 K, Enthalpy_abs (h0 datum), Psat from the NASA9 H2O(L)/H2O pair (IAPWS
; within 0.1 % at 280-300 K). Everything else is mhb98-water's: bc.txt, phase.txt and solfile.tec
; are symlinked, the sections below are its own. Lv stays the latent-heat sink; with the column it
; no longer sets the saturation curve. check.py gates the LK kernel with the tabulated p_sat, the
; K-wet-bulb identity, the mass balance, the run's report of the tabulation and the wet-bulb
; depression against the Clausius-Clapeyron case (282.33 K).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
interface   = LK

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.462478e6   ; MHB98 App.A water: 2.257e6 + 2595*(373.15 - T_R), T_R=293.968 K
Mv    = 18.015
Tboil = 373.15
cpv   = 2366.95      ; MHB98 App.A water Cp,V(T_R). INERT on the CEM path (only ASM/TC read cpv)
Le    = 1.0          ; MHB98 App.A default for species with no tabulated diffusivity (water)
Yinf  = 0.0
psat  = 3.0e3

[GPB-Phase1]
type    = condensed-dispersed
rho     = 997        ; MHB98 App.A (density actually read from properties.dat)
cp      = 4184       ; MHB98 App.A

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 1.1e-3

[wall]
type = wall
q    = 0.0

