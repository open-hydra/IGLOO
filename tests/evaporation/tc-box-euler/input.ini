; tc-box-euler: the EULERIAN half of tc-box. Same case, same physics, same 25 parcels --
; only the output selection differs, so that the equivalent-Eulerian field of a mass-losing
; material (ODE model 2) is written at all. Every other Euler-writing fixture in the suite
; is model 1, and every model-2/5 fixture writes out-file = S, so the model-2/5 branch of
; computeEulField had no coverage whatsoever.
;
; Two changes to tc-box's input.ini, both load-bearing:
;   out-file = ALL   -> eulerSwitch on, so OUTPUT/euler1.tec is written
;   mollify  = off   -> the binomial smoother would mix rho_p and n_p across cells with the
;                       same kernel; the per-cell ratio rho_p/n_p is only EXACT unsmoothed,
;                       and that ratio is the oracle.
; gas-order = 1 is kept (no dual), print-dcell = 1 is kept (one trajectory row per cell entry).
;
; Everything below is tc-box's own header and case; the evaporation physics is gated there.
;
; IGLOO end-to-end verification: TONINI-COSSALI ANALYTICAL EVAPORATION (F2)
; on an AXIS-ALIGNED BOX.
;
; Companion to evaporation/lk-neq. Same uniform-gas box (tools/make_box_case.py) and
; regime, but the gas-side model is TC (Tonini-Cossali 2012, via Antonov et al. 2024
; eq.9; interface = VLE). TC replaces CEM's mass-fraction Spalding closure with the
; variable-density molar Stefan-Fuchs rate:
;   rhs0 = (Mv/Minf)*ln[(1-Xinf)/(1-Xs)]     (molar driver, Xs from psat)
;   m + (Ts/Tg - 1)*Lev*(f(m/Lev)-1) = rhs0, f(x)=x/(1-e^-x)   (solved for m)
;   mdot = -pi*d*rho*Dv*Sh*m,  Sh=2 at Re=0                (Ranz-Marshall bolt-on)
; kV=1 (v0=u_g => Re=0 => Sh=2, particle coasts at u_g) gives the clean x = u_g*t
; mapping; check.py bisection-solves the TC transcendental along the MEASURED Tp(x)
; with RK4 and compares predicted d^2(x).
;
; Regime (heavy fuel Mv=100 >> Mg=28.97 for a strong molar-vs-mass split; Lv=1e6 so the
; drop reaches a clean wet-bulb ~536 K, BELOW Tg=600 K, and coasts there -- no thermal
; runaway, ~23% d^2 loss over the residence). TC exceeds CEM by several % along the path,
; ~4-5 orders above the E13.6 truncation band -> the case CATCHES a silent CEM regression.
; Yinf=0 opens the Spalding gate; Tboil=600 K keeps psat<p (no boiling clamp).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = ALL
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = TC
interface   = VLE

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 1.0e6
Mv    = 100.0
Tboil = 600.0
cpv   = 2000.0
Le    = 1.0
Yinf  = 0.0
psat  = 1.0e4

[GPB-Phase1]
type    = condensed-dispersed
rho     = 8000
cp      = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 20.0e-6

[wall]
type = wall
q    = 0.0

