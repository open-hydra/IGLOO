; IGLOO end-to-end case: the BURNOUT MASS on both sides of 1e-14 kg.
;
; A parcel is consumed at the first accepted step whose mass is at or below the lower of 1e-6 of its
; injection mass and 1e-20 kg; the two bounds cross at an injection mass of 1e-14 kg, a 1.3365 um
; drop at density 8000. Box from tools/make_box_case.py (kv 1, kt 0.5: gas 600 K at 10 m/s, drops at
; 300 K and zero slip, so x is u_g t); 25 diameters 0.1 to 10 um, log-spaced, one per inlet cell.
; The d2-law at Nu and Sh 2 (Re 0) evaporates each drop inside the box; the particle cp of
; d2law-line's table (125000, 100 times a liquid's) keeps the drop near 300 K, so the life is the
; closed form d0^2/K0 within its slow heating. out-time on puts the time on every row and exit record.
; The [GPB-Phase1] section documents the table INPUT/properties.dat (d2law-line's, symlinked).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = d2-law

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.0e5
Mv    = 100.0
Tboil = 900.0
cpv   = 2000.0
Le    = 1.0
Yinf  = 0.0
psat  = 1.0e4

[GPB-Phase1]
material = A
type = condensed-dispersed
rho  = 8000
cp   = 125000

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
; bc.txt carries one radius per inlet cell (make_box_case.py --rp-sweep)

[wall]
type = wall
q    = 0.0
