; IGLOO end-to-end verification: BOILING of a superheated water drop in a hotter gas (boiling ZGR) on the shared box.
;
; boiling-zgr-flash with the drop at 490 K (kt 0.8166666667) and boiling-temperature 422.3191381 K at 1 atm: the
; boiling temperature at the gas pressure is 450 K, 150 K below the gas, so the drop flashes its superheat and boils
; by the heat the gas conducts through the blown film (A 0.0667, the film conductivity at the 1/3-rule film
; temperature). check.py: T(x) and m(x) against the boiling branch integrated with scipy (tools/zgr_oracle.py).
; INPUT/bc.txt from make_fixture.py; solfile.tec is drag-stokes's, properties.dat boiling-zgr-flash's.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
boiling     = ZGR

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv                  = 2.26e6
Mv                  = 18.0
boiling-temperature = 422.3191381
cpv                 = 1900.0
Le                  = 1.0
Yinf                = 0.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 958
cp   = 4186

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 50.0e-6

[wall]
type = wall
q    = 0.0
