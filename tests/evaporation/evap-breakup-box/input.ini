; ODE model 4 end to end: Reitz-Diwakar stripping and bag breakup with d2-law evaporation,
; every drop consumed inside the box. 25 identical 30 um drops at 40 m/s in a 50 m/s, 600 K gas
; (slip 10 m/s, We_r 30, Re 20), T_p0 300 K; the d2law material of tests/common (rho 2950, cp 1250).
; sigma and Lv are verification inputs chosen so the breakup window, the evaporation share inside it
; and the burnout all fall inside the 0.8 m box, not a physical liquid.
; Generator: tools/make_pe_case.py INPUT --we-sweep 30 (x25) --we-convention rad --u-gas 50
;   --kv 0.8 --sigma 6.0e-5 --lx 0.8 --nx 320 --t-gas 600 --kt 0.5
; mollify off: the per-cell sign gate reads the unsmoothed source field.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-10
absolute-tol = 1e-10

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
evaporation = d2-law
breakup     = Reitz-Diawakar

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma               = 6.0e-5
mu                  = 1.0e-3
Lv                  = 2.0e5
Mv                  = 100.0
boiling-temperature = 900.0
cpv                 = 2000.0
Le                  = 1.0
Yinf                = 0.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
