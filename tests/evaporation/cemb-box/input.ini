; cemb-box: lk-neq's box and droplet (20 um, T0 300 K in a 600 K gas, the properties of lk-neq) under the
; CEM-B evaporation model: the classical model with the gas properties of a film at the 1/3-rule
; temperature T_f = T_p + (T_g - T_p)/3. The drops enter at half the gas speed (kV 0.5, Re0 6.7), so the
; convective Sherwood number acts until the slip relaxes; out-time prints the parcel time, the oracle's clock.
; check.py: d^2 along the documented film-rule kernel, integrated over the measured T and slip.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM-B
interface   = VLE

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.0e5
Mv    = 100.0
Tboil = 900.0
cpv   = 2000.0
Le    = 1.0
Yinf  = 0.0
psat  = 1.0e4

[GPB-Phase1]
type    = condensed-dispersed
rho     = 8000
cp      = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 20.0e-6

[wall]
type = wall
q    = 0.0

