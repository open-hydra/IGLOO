; IGLOO end-to-end verification: the SURFACE TEMPERATURE of a P2T drop with slip (Re > 0) whose liquid viscosity
; is a properties.dat column, mu_l(T) 0.1 exp((300 - T)/60) Pa s on 1..1000 K.
;
; The shared box (u_g 10 m/s, T_g 600 K) and an inlet at kV 0.1 (9 m/s slip, Stokes drag) and kT 0.5 (Tp0 300 K);
; rho 2950, cp 1250, d 30 um; the evaporating right-hand side (ODE model 2) with a saturated far field (Yinf 1: no
; mass transfer, B_M 0) and liquid-conduction P2T with k-liq 0.026 W/m/K on the material line (INPUT/phase.txt),
; no mu-liq. The internal circulation (Abramzon-Sirignano 1989 eqs. 30, 32, 39) takes mu_l at the surface
; temperature: the trajectory's surface-temperature column is the root of that balance on every row.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag              = Stokes
heat              = Ranz-Marshall
evaporation       = d2-law
liquid-conduction = P2T

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv                  = 2.26e6
Mv                  = 18.0
boiling-temperature = 373.15
cpv                 = 1900.0
Le                  = 1.0
Yinf                = 1.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30e-6

[wall]
type = wall
q    = 0.0
