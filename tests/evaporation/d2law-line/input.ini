; E-VAL-1: d2-law ANALYTIC-LINE validation (Tier V) on the shared box.
;
; Variant of ../d2law with one knob turned: particle cp = 125000 (100x) via a local
; ATLAS-GPB properties.dat. cp_p does NOT enter the d2-law rate
;   d(d^2)/dt = -K,  K = 8*kg/(cp_g*rho_p) * ln(1+BT),  BT = cp_g*(Tg-Tp)/Lv
; but it slows the droplet heating by 100x, so Tp stays ~= Tp0 = kt*Tg = 300 K over the
; whole residence => BT is FROZEN at its injection value => K is a CLOSED FORM of the
; case inputs alone and d^2(x) = d0^2 - K*(x-x_a)/u_g is an analytic LINE
; (Godsave 1953 / Spalding 1954). check.py gates the measured d^2(x) against that line
; (reference from inputs only -- no run-conditioning; the residual Tp drift enters the
; TOLERANCE budget, not the reference). Companion (run-conditioned) case: ../d2law.
; kV=1 => v0=u_g => Re=0 (Sh=Nu=2 stagnant film) and x = u_g*t exactly.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = d2-law

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.0e5
Mv    = 100.0
Tboil = 900.0
cpv   = 2000.0
Le    = 1.0
Yinf  = 0.0
psat  = 1.0e4

[GPB-Phase1]
; ATLAS GPB regenerates INPUT/{phase.txt,properties.dat} from this section (committed as static fixtures)
material = A
type = condensed-dispersed
rho  = 8000
cp   = 125000

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0

