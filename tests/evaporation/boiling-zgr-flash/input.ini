; IGLOO end-to-end verification: the adiabatic FLASH of a superheated water drop (boiling ZGR) on the shared box.
;
; The drop enters at the gas velocity (kv 1: slip 0, Re 0, Nu 2) at 640 K (kt 1.0666666667) in the 600 K, 2.0664 bar
; gas, d 50e-6 m; the boiling temperature at that pressure (Clausius-Clapeyron through boiling-temperature 551.7783324
; K at 1 atm) is the gas temperature to 4e-8 K, so the boiling branch runs with no heat from the gas: the superheat
; flashes the liquid and the vapour leaves at T_B. check.py: the identity m (Lv - c (T - T_B)) constant on every
; row, and T(x) against the boiling branch integrated with scipy (tools/zgr_oracle.py). INPUT/bc.txt and
; properties.dat from make_fixture.py; INPUT/solfile.tec is drag-stokes's.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
boiling     = ZGR

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv                  = 2.26e6
Mv                  = 18.0
boiling-temperature = 551.7783324
cpv                 = 1900.0
Le                  = 1.0
Yinf                = 0.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 958
cp   = 4186

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 50.0e-6

[wall]
type = wall
q    = 0.0
