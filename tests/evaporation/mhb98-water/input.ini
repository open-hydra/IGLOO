; IGLOO VALIDATION (E-VAL-2): single water droplet vs Miller-Harstad-Bellan 1998
; Fig. 2 (exp. data: Ranz & Marshall 1952b). D0=1.1mm, Td0=282K, TG=298K, Re_d=0.
; Quiescent map: U=1.9e-4 m/s is a pure clock (kv=1 => zero slip => Re=0 => Nu=Sh=2,
; the exact quiescent limit); residence L/U ~ 790 s covers the Fig-2 span. t = x/U.
; ALL properties are MHB98's OWN Appendix-A correlations (air + water: Harpole 1981),
; evaluated ONCE at their constant-property reference temperature T_R = T_WB from their
; eq.(27) = 293.968 K (2026-07-29). Water: Lv=2.257e6+2595(373.15-T), cpv, rho_l=997,
; cp_l=4184, Mv=18.015, Tboil=373.15; dry air Yinf=0. psat via Clausius-Clapeyron =
; MHB98's OWN eq.(10) (single anchor at Tboil, constant Lv) -- same closure, not a
; deviation. Le=1 likewise matches the Appendix's stated default for species with no
; tabulated diffusivity (water is one). Air k/mu/Pr go in via solfile.tec; c_p,g is
; carried in GAM (IGLOO builds cp_g = GAM*R/(GAM-1)). check.py gates IGLOO d^2(x) vs the
; CEM kernel (LK is vacuous here, L_K/d~1e-4); verify.py overlays the digitized M7 line.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
interface   = LK

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.462478e6   ; MHB98 App.A water: 2.257e6 + 2595*(373.15 - T_R), T_R=293.968 K
Mv    = 18.015
Tboil = 373.15
cpv   = 2366.95      ; MHB98 App.A water Cp,V(T_R). INERT on the CEM path (only ASM/TC read cpv)
Le    = 1.0          ; MHB98 App.A default for species with no tabulated diffusivity (water)
Yinf  = 0.0
psat  = 3.0e3

[GPB-Phase1]
type    = condensed-dispersed
rho     = 997        ; MHB98 App.A (density actually read from properties.dat)
cp      = 4184       ; MHB98 App.A
alpha-e = 1.0

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 1.1e-3

[wall]
type = wall
q    = 0.0

