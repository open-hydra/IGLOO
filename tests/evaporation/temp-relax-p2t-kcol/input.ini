; IGLOO end-to-end verification: TEMPERATURE relaxation of a P2T drop whose liquid conductivity is a
; properties.dat column, k_l(T) = 0.026/450 T W/m/K (temp-relax-p2t's case otherwise).
;
; temp-relax's inlet and drop (kV 1: slip 0, Re 0, Ranz-Marshall Nu 2; kT 0.5: Tp0 300 K in a 600 K gas;
; rho 2950, cp 1250, d 11.89e-6 m), the evaporating right-hand side (ODE model 2) with a saturated far field
; (Yinf 1: no mass transfer) and liquid-conduction P2T; the material line (INPUT/phase.txt) carries mu-liq only
; and INPUT/properties.dat the Conductivity column. With zeta(T) = k_g/k_l(T) the mean temperature relaxes with
; tau_ITC (1 + zeta(T)/5) and the surface temperature column holds (5 T + zeta(T) T_g)/(5 + zeta(T)).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag              = Stokes
heat              = Ranz-Marshall
evaporation       = d2-law
liquid-conduction = P2T

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv                  = 2.26e6
Mv                  = 18.0
boiling-temperature = 373.15
cpv                 = 1900.0
Le                  = 1.0
Yinf                = 1.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
