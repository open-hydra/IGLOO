; mhb98-water-blowing: mhb98-water's water droplet (MHB98 Fig. 2: D0 1.05 mm, Td0 282 K in dry air at 298 K,
; Re_d = 0, CEM + LK; INPUT is mhb98-water's) with the Stefan-blowing correction of the convective heat,
; blowing = LK: Q is multiplied by f2 = beta/(e^beta - 1), beta = -(3/2) Pr tau_d mdot/m (MHB98 eqs. 17-19).
; On the wet-bulb plateau K = f2 (TG - Twb) 8 kg / (rho_l Lv). check.py runs mhb98-water's gates with f2 in
; the identity, then the same droplet without blowing (ref-noblow/) and a coupled droplet kernel for the
; shifts of K and Twb that blowing causes.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
interface   = LK
blowing     = LK

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.462478e6   ; MHB98 App.A water: 2.257e6 + 2595*(373.15 - T_R), T_R=293.968 K
Mv    = 18.015
Tboil = 373.15
cpv   = 2366.95      ; MHB98 App.A water Cp,V(T_R). INERT on the CEM path (only ASM/TC read cpv)
Le    = 1.0          ; MHB98 App.A default for species with no tabulated diffusivity (water)
Yinf  = 0.0
psat  = 3.0e3

[GPB-Phase1]
type    = condensed-dispersed
rho     = 997        ; MHB98 App.A (density actually read from properties.dat)
cp      = 4184       ; MHB98 App.A

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 1.1e-3

[wall]
type = wall
q    = 0.0

