; IGLOO end-to-end case: an evaporating water drop burns out at gas order 2 on a planar slab.
;
; A one-layer box (20 x 20 x 1 cells over 0.1 x 0.1 x 0.005 m: the planar 2D path, the bilinear gas sample) holds
; a uniform nitrogen-like gas at rest (350 K, gamma 1.399, R 296.8 J/(kg K); make_fixture.py). Four 20 um water
; drops are placed at 320 K in four dual cells, moving at 0.5 m/s along x: Stokes drag stops them within
; 0.55 mm, then they evaporate (CEM, Langmuir-Knudsen interface) at rest until the burnout mass
; min(1e-6 m0, 1e-20 kg), 1e-20 kg here. mass-tol off: the mass slot keeps the default absolute tolerance 1e-10,
; above a 4.2e-12 kg drop's mass, so the tail of the life is outside SDIRK4's error control and its Newton trial
; states land far outside the domain. The case gates that such a trial state never stops the run and that every
; drop ends on a burnout with its mass handed to the gas; a sibling run with the default mass-tol (burnout: the
; mass slot at 1e-3 of the burnout mass) runs into ref-burnout/ (check.py).
; INPUT/properties.dat is mhb98-water's (rho 997, cp 4184; symlinked), INPUT/phase.txt the common one.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
mass-tol = off

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
interface   = LK

[IGLOO-Properties]
Lv    = 2.462478e6
Mv    = 18.015
Tboil = 373.15
cpv   = 2366.95
Le    = 1.0
Yinf  = 0.0
psat  = 3.0e3

[IGLOO-BC]
x     = 0.02 0.02 0.02 0.02
y     = 0.03 0.045 0.055 0.07
z     = 0.0025 0.0025 0.0025 0.0025
up    = 0.5 0.5 0.5 0.5
vp    = 0.0 0.0 0.0 0.0
wp    = 0.0 0.0 0.0 0.0
diam  = 20.0e-6 20.0e-6 20.0e-6 20.0e-6
mdot  = 1.0e-6 1.0e-6 1.0e-6 1.0e-6
temp0 = 320.0 320.0 320.0 320.0

[GPB-Phase1]
type    = condensed-dispersed
rho     = 997
cp      = 4184

[BCB-Block1]
face1 = wall
face2 = wall
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[wall]
type = wall
q    = 0.0
