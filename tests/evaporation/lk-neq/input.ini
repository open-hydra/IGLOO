; IGLOO end-to-end verification: LANGMUIR-KNUDSEN NON-EQUILIBRIUM INTERFACE (F1)
; on an AXIS-ALIGNED BOX.
;
; Companion to evaporation/d2law. Same uniform-gas box (tools/make_box_case.py), but
; the gas-side model is CEM (BM-driven; d2-law is BT-driven and blind to the interface
; correction) and interface = LK (Miller-Harstad-Bellan 1998, model M2):
;   Xs = Xs_eq - (2 L_K/d)*beta,  L_K = mu*sqrt(2 pi Tp Ru/Mv)/(alpha_e*Sc*p),
;   beta = -mdot*Pr/(2 pi mu d)   (implicit; production solves by bounded Picard)
; kV=1 (v0=u_g => Re=0 => Sh=2, particle coasts at u_g) gives the clean x = u_g*t
; mapping; check.py integrates the LK-corrected CEM kernel (a genuine d-dependent ODE,
; unlike d2law's) along the MEASURED Tp(x) with RK4 and compares predicted d^2(x).
;
; Regime (tuned for a strong, non-vacuous LK signal): d0=20 um at p=rho*R*T~2.07 bar.
; At the wet bulb (~540 K) 2L_K/d ~ 7e-3 and beta ~ 0.27 => ~2% rate deficit vs VLE,
; ~4 orders above the E13.6 truncation band; ~60% d^2 loss over the 0.015 s residence,
; droplet survives to the outlet. Yinf=0 opens the Spalding gate; Tboil=900 K keeps
; psat<p (no boiling clamp) over the whole Tp range.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
interface   = LK

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.0e5
Mv    = 100.0
Tboil = 900.0
cpv   = 2000.0
Le    = 1.0
Yinf  = 0.0
psat  = 1.0e4

[GPB-Phase1]
type    = condensed-dispersed
rho     = 8000
cp      = 1250
alpha-e = 1.0

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 20.0e-6

[wall]
type = wall
q    = 0.0

