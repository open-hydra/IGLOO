; d2law-varcp: d2law's evaporating drops (the d2-law, 30 um, T0 300 K in a 600 K gas, kV = 1 so Re = 0 and
; x = u_g t) with a varying cp: INPUT/properties.dat (make_table.py) holds 250..900 K, cp = 1000 + 2 (T - 250),
; the enthalpy its trapezoid sum. The particle state is the enthalpy, dh/dt = (Q + mdot L_v)/m, and the
; temperature comes back through the table; the gas receives the evaporated mass at the table's enthalpy.
; check.py: d2law's mass-rate oracle, the enthalpy history along the measured d, the energy telescoping.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = d2-law

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.0e5
Mv    = 100.0
Tboil = 900.0
cpv   = 2000.0
Le    = 1.0
Yinf  = 0.0
psat  = 1.0e4

[GPB-Phase1]
type = condensed-dispersed
rho  = 8000
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0

