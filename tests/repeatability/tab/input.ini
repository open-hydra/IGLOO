; B-VAL-3: TAB (O'Rourke-Amsden 1987) breakup, 25-drop RADIUS-based Weber sweep across
; the onset We_r = WeCrit/2 = 6 in one run. Gas U=50, drops v0=25 (kv=0.5) => slip=25;
; per-cell diameter sets We_r (make_pe_case.py --we-convention rad).
; check.py gates (Tier V): first-breakup time vs the analytic damped-oscillator
; y(t) crossing (ORA87 eq. 5 closed form) + the no-break onset below We_r=6.
; TAB constants at the ORA87 defaults: Comega(Ck)=8, Cmu(Cd)=5, WeCrit=6 (doubled to
; 12 internally, radius convention); Rosin-Rammler product sampling (method 2, n=3.5).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = TAB
method      = 2
n           = 3.5

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3

[GPB-Phase1]
; ATLAS GPB regenerates INPUT/{phase.txt,properties.dat} from this section (committed as static fixtures)
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0

