; IGLOO two-sweep gate: drag-stokes's parcels stopped by time-end, so a sweep ends inside or at the outlet.
;
; The case is repeatability/drag-stokes (the uniform 10 m/s, 600 K gas on the 0.15 m box, Stokes drag,
; 25 parcels of 11.89 um injected at kV 0.1 of the gas speed) with time-end 12 ms. In the original gas a
; parcel needs 16.16 ms to reach the outlet: at 12 ms it is inside, at x 0.1084 m, and its record is the
; time-end record with boundary code 0. In the gas cycle's middle sweep (U doubled, the injection speed
; with it) every parcel leaves through the outlet at 8.66 ms with code 400. The three sweeps of the cycle
; therefore end inside, at the outlet, inside: the exit code a sweep sets must not survive into the next.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
time-end    = 12e-3

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
