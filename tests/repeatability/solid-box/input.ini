; IGLOO end-to-end verification: SOLIDIFICATION (ODE model 6) on the shared AXIS-ALIGNED BOX.
;
; Molten droplets (T0 at four times the 600 K gas) cool as liquid, supercool to T-nuc, recalesce
; to T-melt, hold a freezing plateau there, then cool as solids. The inlet decouples heat from
; drag as in temp-relax (the injection velocity equals the gas velocity, so the Reynolds number
; is zero and Nu is 2), so every regime has a closed form in x. The material line of
; INPUT/phase.txt carries the solidification tokens (h-fus, cp-solid; T-melt and T-nuc at their
; defaults 2327 K and 0.8 T-melt). mollify off keeps the energy source per cell (check.py E4b).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
