; burn-box-cap-gallier: the OXIDE CAP under Gallier et al. 2021's deposition law. burn-box-cap's box, 25 parcels,
; burn law and product (INPUT/phase.txt), the retained fraction from the law (the word Gallier21 for xi-law) in place
; of a constant xi-cap: xi = g(d_Al) h(f_ox) at the metal's current diameter and the cap's mass fraction, and each
; parcel's stretch c on the law's path from its injected size. bc.txt and solfile.tec are burn-box's, the table
; burn-box-cap's. The source field (out-file S) carries the mass books; mollify off leaves it unsmoothed.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 8000
cp   = 1250
