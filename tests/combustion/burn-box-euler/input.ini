; burn-box-euler: the EULERIAN field of a burning material (ODE model 5). burn-box's case, its 25
; parcels and its physics; only the output selection differs, so that OUTPUT/euler1.tec is written:
;   out-file = ALL   -> eulerSwitch on (the euler moments are integrated and deposited)
;   mollify  = off   -> rho_p and n_p unsmoothed: their per-cell ratio, the time-mean droplet mass, is
;                       exact only without the binomial smoother, and that ratio is the oracle
; gas-order = 1 and print-dcell = 1 are kept (one trajectory row per cell entry). The burn law itself is
; gated by burn-box; INPUT/ links burn-box's files.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = ALL
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 8000
cp   = 1250
