; burn-box-ox0: an OXIDE FRACTION AT INJECTION on a burning aluminium droplet. burn-box-residue's uniform-gas box, 25
; parcels, burn law (K-burn 2.0e-6) and oxide cap (xi-cap 0.2, product OX, residue=on) with xi-ox0 0.1 on the burning
; line (INPUT/phase.txt): the inlet's diameter and loading describe the whole particle, a tenth of its mass oxide at
; injection; the cap grows from that oxide and the stretch c is re-evaluated from it. OX carries no model on its line
; (an inert residue). INPUT/properties.dat is burn-box-cap's absolute two-zone table.
;   out-file = S     -> the source field (mass and energy books)
;   out-time = on    -> the parcel time on every row and exit record
;   mollify  = off   -> the source field unsmoothed

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 8000
cp   = 1250
