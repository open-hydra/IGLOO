; IGLOO end-to-end verification: METAL COMBUSTION (M1 Beckstead d^n burn law) on an
; AXIS-ALIGNED BOX.
;
; Companion to evaporation/d2law. Same uniform-gas box (tools/make_box_case.py,
; kv=1 kt=1 rp=15e-6). Goal: verify the model-5 production burn rate against the
; Beckstead d^n regression [Lib_Combustion::becksteadRate]:
;   d^n(t) = d0^n - Keff*t,  Keff = K-burn * X-eff,  mdot = -(rho_p*pi*Keff/(2n))*d^(3-n)
; Above T-ign the rate is INDEPENDENT of the gas/particle temperature, so with kv=1
; (no slip => u=u_g=10 m/s exactly, x = u_g*t) the diameter history has an exact
; closed form d(x) that check.py transcribes independently.
;
; Heat release: Tp0 = Tg = 600 K (kt=1) so convective heat is zero at injection and
; ALL initial Tp rise comes from the combustion release beta-part*q-comb*|mdot|; as
; Tp exceeds Tg, Nu=2 convection (Re=0, Ranz-Marshall) cools. check.py RK4-integrates
; that energy balance independently along the closed-form d(x).
;
; Regime: Keff*t_res/d0^n ~ 0.5 at the outlet (t_res = 15 ms) => ~50% d^n loss, ~21%
; diameter loss; the particle survives to the outlet (burnout events are phase M2).
; T-ign = 550 K < Tp0: ignited from injection (the inert-below-T-ign gate is
; unit-tested bitwise in test_combustion CB3).
; rho_p = 2950 comes from INPUT/properties.dat ([GPB-Phase1] rho is ignored).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 8000
cp   = 1250
combustion = Beckstead
K-burn     = 4.5e-7
n-burn     = 1.8
X-eff      = 0.5
T-ign      = 550.0
beta-part  = 0.3
q-comb     = 1.0e6

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0

