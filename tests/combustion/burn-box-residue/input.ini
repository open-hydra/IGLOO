; burn-box-residue: the BURNOUT RESIDUE of an aluminium droplet. burn-box's uniform-gas box and 25 parcels with a
; faster burn law (K-burn 2.0e-6: every parcel burns out near x = 0.072 m), the oxide cap (xi-cap 0.2, product OX)
; and residue=on on the burning line (INPUT/phase.txt). At burnout the cap becomes a parcel of the product OX, born
; at its parent's state; OX freezes (solidification=on with alumina's data on its own line): born undercooled, it
; nucleates and relaxes to the gas temperature. INPUT/properties.dat is burn-box-cap's absolute two-zone table.
; check.py runs two siblings: ref-dres/ (d-residue = 5e-6 m and two groups on the burning line) and ref-fail/
; ([IGLOO-ODE] fail-after = 3.6e-3: the residue born after a solver failure).
;   out-file = S     -> the source field (mass and energy books)
;   out-time = on    -> the parcel time on every row and exit record
;   mollify  = off   -> the source field unsmoothed

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 8000
cp   = 1250
