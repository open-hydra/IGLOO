; IGLOO end-to-end case: BURNOUT TIMES of aluminium in air (Beckstead 2005, Eq. 7) on an
; AXIS-ALIGNED BOX, beside the burning times of Beckstead's Fig. 1.
;
; Box from tools/make_box_case.py (kv=1 kt=1, gas 300 K at 0.04 m/s, 25 radii 5e-6 .. 5e-4 m, one
; per inlet cell). Condition: air at 1 atm and 300 K, X_eff = C_O2 = 0.21 (mole fraction):
; Eq. 7 t_b = a D^n/(X_eff p^0.1 T0^0.2), a = 0.00735, n = 1.8 => K_eff = 1.416955485e-6 m^1.8/s,
; K-burn = K_eff/X_eff = 6.74740707e-6 (nine digits: the late trajectory rows resolve the input
; to 1e-8). T-ign = 250 K lies below the injection temperature: a switch that lets every parcel
; burn from injection (the rate does not depend on the particle temperature above ignition). No
; heat release (beta-part, q-comb at 0): T_p stays 300 K. Every parcel burns out inside the box
; (the 1 mm parcel at x = 0.112 m); out-time = on puts the time on every row and exit record;
; absolute-tol 1e-20 keeps SDIRK4's control on the mass of the small sizes (a 10 um particle weighs
; 1.5e-12 kg).
; rho_p = 2950 and c_p = 1250 come from INPUT/properties.dat (IGLOO reads no [GPB-Phase1] key).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-10
absolute-tol = 1e-20

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
; bc.txt carries one radius per inlet cell (make_box_case.py --rp-sweep)

[wall]
type = wall
q    = 0.0
