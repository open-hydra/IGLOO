; burn-box-cap: the OXIDE CAP on a burning aluminium droplet (ODE model 8). burn-box's uniform-gas box, 25
; parcels and burn law (K-burn 4.5e-7, n-burn 1.8, X-eff 0.5, T-ign 550 K, beta-part 0.3, q-comb 1e6 J/kg) with
; xi-cap 0.2 and product OX on the burning line (INPUT/phase.txt). The cap grows by xi*nu of the metal burned, the
; burn law is scaled by the exposed-surface factor F(f_ox) and the stretch c, and drag and heat act on the
; equal-volume sphere of metal and cap. INPUT/properties.dat (make_table.py) carries the absolute datum: zone A the
; metal, zone OX the product (liquid alumina, rho 3950, cp 1887.6). bc.txt and solfile.tec are burn-box's.
;   out-file = ALL   -> the source field and the eulerian field (euler1.tec) are written
;   mollify  = off   -> rho_p and n_p unsmoothed: their per-cell ratio is the time-mean parcel mass

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = ALL
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 8000
cp   = 1250
