; burnout-direct: drops of combustion=direct heated into their burning temperature burn on the d2-law and are removed at
; d-burnout (check.py).
; burn-box's uniform gas (600 K, 10 m/s, k 0.026 W/m/K, gamma 1.4, R 287 J/kg/K), its solfile.tec symlinked; its own
; bc.txt (tools/make_box_case.py --kv 1 --kt 0.5 --rp-sweep 5.00e-06,...,1.46e-05: 25 inlet cells, one radius each,
; 5.0 to 14.6 um by 0.4 um), so 25 drops of 10 to 29.2 um enter at 300 K with the gas velocity (no slip, Re 0,
; Ranz-Marshall Nu 2). Its models.txt: T-burn 302 K, 2 K above the injection temperature, q-comb 3.1e7 J/kg,
; d-burnout 3 um; Lv 1.08e7 J/kg below. Each drop heats to T-burn, burns there at a constant temperature with the
; transfer number B = (cp_g (T_g - T-burn) + q-comb)/Lv and is removed inside the box when it reaches d-burnout.
; rho_p 2950 and cp_p 1250 come from INPUT/properties.dat ([GPB-Phase1] rho and cp are ignored).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall

[IGLOO-Properties]
Lv = 1.08e7

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 8000
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
