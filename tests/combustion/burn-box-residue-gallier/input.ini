; burn-box-residue-gallier: the BURNOUT RESIDUE under Gallier et al. 2021's deposition law. burn-box-residue's box,
; product and residue on the burning line (INPUT/phase.txt), the retained fraction from the law (the word Gallier21
; for xi-law), a faster burn law (K-burn 1.5e-4) and five inlet sizes, one per inlet row j (INPUT/bc.txt: burn-box's
; with the radius 10, 35, 100, 200 and 50 um): every parcel burns out inside the box and its residue's mass is the
; law's cap at burnout, which depends on the injected size. solfile.tec is burn-box's, the table burn-box-cap's.
;   out-file S, the source field (the mass and energy books); out-time on, the parcel time on every row and exit
;   record; mollify off, the source field unsmoothed

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 8000
cp   = 1250
