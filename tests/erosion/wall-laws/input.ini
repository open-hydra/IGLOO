; wall-laws: the erosion laws of [IGLOO-Erosion] in OUTPUT/wall.tec, on wall-flux's box (INPUT symlinked: face 2,
; x = 0.15, coded 301; material A in two groups, B in one). Eight assigned streams with NoDrag start 2 mm from the
; wall and hit it on straight lines at 90, 70, 50, 35, 20, 10, 15 and 60 deg from the surface, with diameters from
; 10 to 120 um; streams 1 and 8 share the cell (1,1). A follows Oka et al. (2005): silica's constants (Part 2
; Table 1) with n1, n2 and k2 from their correlations (Part 1 Table 3, Part 2 Table 1) and a wall of Hv 1.43 GPa,
; a = 0.05, b = 1.2. B follows Neilson-Gilchrist (1968): Table I at 424 ft/s (phi 3571, epsilon 8375 ft.lbf/g,
; n 5: alpha0 = 18 deg) with k = 20 m/s (the paper's K), so streams 6 and 7 cut below alpha0 and below k, the
; others above.
; check.py: er-A, er-B and rdot per cell from an independent oracle of the two laws, the constants in the log,
; and ref-direct/: the same deck with n1, n2, k2 given as values.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
out-file    = S
print-dcell = 1

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = NoDrag
heat = NoHeat

[IGLOO-BC]
x     = 0.148 0.148 0.148 0.148 0.148 0.148 0.148 0.148
y     = 0.005 0.015 0.025 0.035 0.049 0.005 0.012 0.008
z     = 0.005 0.005 0.005 0.005 0.005 0.012 0.035 0.008
up    = 100.0 93.9692620785908 76.6044443118978 57.3576436351046 34.2020143325669 17.364817766693 15.5291427061512 69.2820323027551
vp    = 0.0 34.2020143325669 0.0 57.9227965339569 -93.9692620785908 0.0 57.9555495773441 0.0
wp    = 0.0 0.0 64.2787609686539 57.9227965339569 0.0 98.4807753012208 0.0 -40.0
diam  = 10.0e-6 20.0e-6 30.0e-6 50.0e-6 80.0e-6 120.0e-6 40.0e-6 15.0e-6
mdot  = 1.0e-4 2.0e-4 1.5e-4 0.5e-4 1.0e-4 0.8e-4 1.2e-4 0.6e-4
temp0 = 600.0

[IGLOO-Erosion]
model        = Oka Neilson-Gilchrist
wall-density = 1800.0
Hv           = 1.43
a            = 0.05
b            = 1.2
K            = 65.0 0.0
k1           = -0.12 0.0
k2-s         = 2.3 0.0
k2-q         = 0.038 0.0
k3           = 0.19 0.0
n1-s         = 0.71 0.0
n1-q         = 0.14 0.0
n2-s         = 2.4 0.0
n2-q         = -0.94 0.0
v-ref        = 104.0 0.0
D-ref        = 326.0e-6 0.0
phi          = 0.0 4841625.893491431
epsilon      = 0.0 11354975.31727548
n            = 0.0 5.0
k            = 0.0 20.0
