; khrt-shed-noexchange: the khrt-e2e case with drag = NoDrag and heat = NoHeat, so the only thing
; a parcel can hand the gas is what a KH shed moves from parent to child. Every drop keeps its
; injection velocity (100 m/s, slip 100 m/s) and temperature (300 K); KH stripping and shedding run
; the whole length of the box, and no RT event fires (zero acceleration). The source field must be
; zero in every cell: the child's birth flux leaves with the child. mollify off keeps the source
; field cell-local. INPUT is the khrt-e2e case's.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = NoDrag
heat        = NoHeat
breakup     = Reitz-KHRT

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3

[GPB-Phase1]
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0
