; B-VAL-4: Reitz-Diwakar (RD) breakup, radius-based Weber sweep spanning BOTH regimes —
; bag (6 < We_r < 0.5·sqrt(Re)) and stripping (We_r > 0.5·sqrt(Re)). Gas U=200, drops
; v0=100 (kv=0.5) => slip=100 => the bag/stripping handoff sits at We_r=20 (We_r 8..18
; bag, We_r 22..1000 stripping). check.py gates each drop's integrated initial breakup
; rate vs the RD closed form for its regime (Reitz-Diwakar 1987, SAE 870598: bag D=pi,
; stripping C=20, verified against the paper). RD is model 3 (ODE-path, not an event).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = Reitz-Diawakar

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3

[GPB-Phase1]
; ATLAS GPB regenerates INPUT/{phase.txt,properties.dat} from this section (committed as static fixtures)
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0

