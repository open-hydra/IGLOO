; Reitz KH-RT's parent drop against Hsiang and Faeth's core drop at the end of shear breakup:
; tab-hf92's INPUT (linked), d0 1000 um in every inlet cell, 25 diameter-based Weber numbers
; 15 to 600 set by the slip, air 1.18 kg/m3 and 1.85e-5 Pa s at 297 K, gas U 200 m/s, 1.2 m box
; whose lateral faces 3-6 reflect: a parcel leaves through the outlet only. mShedLim 1: no KH shed.
; Rows at every segment end (print-dtime 1e-12, no print-dcell): the first RT event has its own row.
; Four planes in the first cell bracket the early RT events. check.py gates the class population and
; each parcel's first RT; verify.py draws the parent against [HF93] eqs. 2-8, never gated.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dtime = 1e-12
out-time    = on
out-scatter = off
out-file    = S
plane-x     = 0.0005 0.001 0.0015 0.002

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = Reitz-KHRT
mShedLim    = 1

[IGLOO-BC]
ds = 0.5

[IGLOO-Properties]
sigma = 0.0708
mu    = 8.94e-4

[GPB-Phase1]
; INPUT/phase.txt is tab-e2e's; INPUT/properties.dat is tab-e2e's table with the Density column at 997
material = A
type    = condensed-dispersed
rho     = 997
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = sym
face4 = sym
face5 = sym
face6 = sym

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 1.0e-3

[sym]
type = symmetry
