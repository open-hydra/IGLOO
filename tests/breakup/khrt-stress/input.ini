; A23/S4-E robustness stress: the breakup/khrt-e2e fixture with mShedLim driven 3x below its
; default, so each parent sheds tens of children instead of one. Exercises the growable
; per-parent shed lists (repeated doublings) and the runaway guard. NOT a validation case --
; there is no oracle here; see INFO.md. Gas U=200, drops v0=100 (kv=0.5) => slip=100.
[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9
[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = Reitz-KHRT
; 0.03 is the production default; 0.01 makes the parent shed after a 1% accumulated loss.
mShedLim    = 0.01
[IGLOO-BC]
ds = 10.0
[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3
[GPB-Phase1]
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182
[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall
[out]
type = outlet
[in]
type = inlet
krho = 0.34
dp   = 0.6e-3
[wall]
type = wall
q    = 0.0
