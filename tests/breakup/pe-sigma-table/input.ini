; pe-sigma-table: the 25-drop Weber sweep of pilch-erdman-e2e (its gas file and boundary file
; symlinked) with the surface tension and the viscosity from the Sigma and Viscosity columns of
; INPUT/properties.dat; no [IGLOO-Properties]. No convective heat exchange keeps every drop at
; the injection temperature, 300 K. check.py runs the PE87 kernel of pilch-erdman-e2e with the
; columns' values at 300 K.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = NoHeat
breakup     = Pilch-Erdman
Cd          = 0.5
B           = 0.0758

[IGLOO-BC]
ds = 10.0
