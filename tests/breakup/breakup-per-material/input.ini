; Breakup per material: four water materials in tab-e2e's box, each running its own breakup model and
; constants from the tokens of its phase-file line over the [IGLOO-Models] defaults (INPUT/phase.txt,
; hand-written):
;   A  TAB with the token TAB-Comega 10, written before its breakup token
;   B  Reitz-KHRT with the token KHRT-B1 40
;   C  no breakup (no sigma, no mu: entries 0)
;   D  Reitz-KHRT with B1 30 from [IGLOO-Models] (its TAB-Comega token belongs to another model: unused)
; INPUT/bc.txt is tab-e2e's with krho 0.085: the one table feeds every family, so the four sum to
; tab-e2e's 0.34. check.py reruns the case once per material without tokens, that material's model
; and constants given to all four in [IGLOO-Models] (ref-A .. ref-D), and requires the same
; trajectories, exits and children counts for it.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
B1          = 30

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0.072 0.072 0 0.072
mu    = 1.0e-3 1.0e-3 0 1.0e-3

[GPB-Phase1]
; documents the static INPUT/{phase.txt,properties.dat}: four materials A B C D of tab-e2e's water
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0
