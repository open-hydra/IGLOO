; B-VAL-1: Pilch-Erdman breakup, 25-drop Weber sweep (We 20..1000) in one run.
; Gas U=200, drops v0=100 (kv=0.5) => slip=100; per-cell diameter sets We (make_pe_case.py).
; check.py extracts each drop's integrated breakup rate vs PE87's PUBLISHED T*(We).
; EXPECT RED while A16 (Lib_Breakup:130 sign) is present: 45<We<351 drops break ~10x too slow.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = Pilch-Erdman
Cd          = 0.5
B           = 0.0758

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3

[GPB-Phase1]
; ATLAS GPB regenerates INPUT/{phase.txt,properties.dat} from this section (committed as static fixtures)
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0

