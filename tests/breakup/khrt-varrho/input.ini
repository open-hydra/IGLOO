; khrt-varrho: the khrt-e2e case (KHRT breakup, ODE model 3) with a density that varies with temperature.
; INPUT/properties.dat holds rho = 1000 - 0.8 (T - 270) kg/m3 on 1..1000 K (cp 4182, h = cp T) and bc.txt injects
; at 0.9 T_g (270 K), so the drops heat toward the 300 K gas and their density falls as they go.
; The table is tab-varrho's. Every RT event and KH shed conserves the stream mass flow. check.py: khrt-e2e's
; exit mass-flow total at a tolerance of 1e-5 and its source mass budget, and the printed diameter against
; (6 m / (pi rho(T)))^(1/3).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9
[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = Reitz-KHRT
[IGLOO-BC]
ds = 10.0
[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3
[GPB-Phase1]
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182
[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall
[out]
type = outlet
[in]
type = inlet
krho = 0.34
dp   = 0.6e-3
[wall]
type = wall
q    = 0.0
