; khrt-evap-frozen-euler: khrt-evap-frozen with the Eulerian output on (out-file ALL, mollify off) and
; the parcel time on every exit record. A KH-shed child enters with the model-4 state of its birth,
; droplet mass and number rate, and must keep it while the Eulerian moments are integrated beside it;
; the Eulerian mass then equals the mass-time the parcels carried through the box. INPUT is the
; khrt-e2e case's; check.py runs khrt-evap-frozen's oracles plus the Eulerian mass.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = ALL
mollify     = off
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = Reitz-KHRT
evaporation = d2-law

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma               = 0.072
mu                  = 1.0e-3
Lv                  = 2.26e6
Mv                  = 18.0
boiling-temperature = 373.15
cpv                 = 1900.0
Le                  = 1.0
Yinf                = 1.0

[GPB-Phase1]
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0
