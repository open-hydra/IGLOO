; tab-wedge-slip: TAB breakup of three rotated copies of one parcel on a gas-order-1 wedge.
;
; An annular wedge (tools/make_wedge_case.py --u0 100 --omega 200 --lx 0.2 --nx 20: x in 0 to 0.2 m, r in 0.19 to
; 0.99 m, one 1 deg sector) carrying U 100 m/s and the solid-body swirl W of 200 rad/s; three 200 um water drops
; injected at x 0.002 m, r 0.20 m and the azimuths -0.45, 0 and +0.45 deg, each at 50 m/s axial and 20 m/s radial
; in its own frame. The three are rotated copies of one parcel: the exact dynamics gives them one breakup time.
; print-ds 1e-9 writes a row at every segment end, so the first row with a smaller diameter is the event.
; check.py: the event times of the two off-centre copies agree; a sibling at gas order 2 (ref-ord2) is the control.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-ds    = 1e-9
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag    = Schiller-Naumann
heat    = Ranz-Marshall
breakup = TAB
method  = 2
n       = 3.5

[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3

[IGLOO-BC]
x     = 0.002 0.002 0.002
y     = 1.999938315289579e-01 2.000000000000000e-01 1.999938315289579e-01
z     = -1.570780177742267e-03 0.0 1.570780177742267e-03
up    = 50.0 50.0 50.0
vp    = 1.999938315289579e+01 2.000000000000000e+01 1.999938315289579e+01
wp    = -1.570780177742267e-01 0.0 1.570780177742267e-01
diam  = 2.0e-4 2.0e-4 2.0e-4
mdot  = 1.0e-6 1.0e-6 1.0e-6
temp0 = 300.0 300.0 300.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 1000
cp   = 4182
