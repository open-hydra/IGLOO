; TAB (O'Rourke-Amsden 1987) products against Hsiang and Faeth's shock-tube water series:
; d0 1000 um in every inlet cell, 25 diameter-based Weber numbers 15 to 600 set by the slip
; (make_pe_case.py --d0), air 1.18 kg/m3 and 1.85e-5 Pa s at 297 K, gas U 200 m/s, 1.2 m box
; whose lateral faces 3-6 reflect (--side-code 300): a parcel leaves through the outlet only.
; check.py gates the preconditions of the overlays: the population per class, every drop broke,
; the cascade ended inside the box, every parcel still in the box at 5 t*.
; verify.py draws [HF92] eq. 14 (SMD), the root-normal distribution and [HF93] eq. 13, never gated.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 4
out-time    = on
out-scatter = off
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = TAB
method      = 2
n           = 3.5

[IGLOO-BC]
ds = 0.2

[IGLOO-Properties]
sigma = 0.0708
mu    = 8.94e-4

[GPB-Phase1]
; INPUT/phase.txt is tab-e2e's; INPUT/properties.dat is tab-e2e's table with the Density column at 997
material = A
type    = condensed-dispersed
rho     = 997
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = sym
face4 = sym
face5 = sym
face6 = sym

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 1.0e-3

[sym]
type = symmetry
