; khrt-e2e-euler: the khrt-e2e case (ODE model 3, KH-RT without evaporation) with the Eulerian
; output on (out-file ALL, mollify off) and the parcel time on every exit record. A KH-shed child
; enters with its number rate in its model-3 state and must keep it while the Eulerian moments are
; integrated beside it; the Eulerian mass then equals the mass-time the parcels carried through the
; box. INPUT is the khrt-e2e case's; check.py runs its oracles plus the Eulerian mass.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = ALL
mollify     = off
out-time    = on
[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9
[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = Reitz-KHRT
[IGLOO-BC]
ds = 10.0
[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3
[GPB-Phase1]
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182
[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall
[out]
type = outlet
[in]
type = inlet
krho = 0.34
dp   = 0.6e-3
[wall]
type = wall
q    = 0.0
