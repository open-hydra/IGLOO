; tab-evap-frozen-varrho: the tab-evap-frozen case (TAB events under ODE model 2, a zero evaporation rate) with
; tab-varrho's inputs (INPUT is its).
; INPUT/properties.dat holds rho = 1000 - 0.8 (T - 270) kg/m3 on 1..1000 K (cp 4182, h = cp T) and bc.txt injects
; at 0.9 T_g (270 K), so the drops heat toward the 300 K gas and their density falls as they go.
; An event resizes the drop at constant stream mass, so the gas receives no mass. check.py: tab-varrho's
; mass and diameter gates and tab-evap-frozen's source gate.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = TAB
method      = 2
n           = 3.5
evaporation = d2-law

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma               = 0.072
mu                  = 1.0e-3
Lv                  = 2.26e6
Mv                  = 18.0
boiling-temperature = 373.15
cpv                 = 1900.0
Le                  = 1.0
Yinf                = 1.0

[GPB-Phase1]
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0
