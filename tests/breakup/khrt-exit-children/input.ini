; khrt-exit-children: five water drops placed 5e-11 m before the outlet at 0.01 m/s in the 200 m/s box gas. Each
; first step crosses the outlet and is final; with B1 = 0.1 and mShedLim = 1e-4 the KH shed fires on it, so the
; child is born past the outlet, on its parent's exit step.
[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dtime = 1e-12
out-time    = on
out-file    = S
plane-x     = 0.15

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag     = Schiller-Naumann
heat     = Ranz-Marshall
breakup  = Reitz-KHRT
B1       = 0.1
mShedLim = 1e-4

[IGLOO-BC]
x     = 0.14999999995 0.14999999995 0.14999999995 0.14999999995 0.14999999995
y     = 0.005 0.015 0.025 0.035 0.045
z     = 0.025
up    = 0.01
diam  = 6e-4
mdot  = 1e-4
temp0 = 300.0

[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3

[GPB-Phase1]
type = condensed-dispersed
rho  = 1000
cp   = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
