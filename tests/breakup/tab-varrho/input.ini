; tab-varrho: the tab-e2e case (TAB events, ODE model 1) with a density that varies with temperature.
; INPUT/properties.dat holds rho = 1000 - 0.8 (T - 270) kg/m3 on 1..1000 K (cp 4182, h = cp T) and bc.txt injects
; at 0.9 T_g (270 K), so the drops heat toward the 300 K gas and their density falls as they go.
; A drop keeps its mass between breakup events and its diameter follows the density. check.py: the printed
; mass is constant between events and jumps only at one, and the printed diameter is (6 m / (pi rho(T)))^(1/3).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = TAB
method      = 2
n           = 3.5

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3

[GPB-Phase1]
; ATLAS GPB regenerates INPUT/{phase.txt,properties.dat} from this section (committed as static fixtures)
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0

