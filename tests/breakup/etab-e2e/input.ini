; B-VAL-5: ETAB (Enhanced TAB, Tanner 1997/1998) breakup, 25-drop RADIUS-based Weber
; sweep across the onset We_r=6 AND the bag->stripping transition WeTrans=80, in one run.
; Gas U=50, drops v0=25 (kv=0.5) => slip=25; per-cell diameter sets We_r.
; ETAB shares the TAB damped oscillator (onset + t_bu identical to B-VAL-3), and adds a
; DETERMINISTIC exponential-cascade product size (Tanner eq. 6/8, NO RNG on the size).
; check.py gates (Tier V): no-break onset, first-breakup time vs the ORA87 oscillator,
; and the child-size ratio d_child/d_parent = exp(-(Kbr/w) acos(1-12/We)) vs Tanner.
; Defaults: k1=k2=0.2222, WeCrit=6(->12), WeTrans=80, Comega=8, Cmu=5 (Tanner-1998 table).
; gas-order=1 kept deliberately (ETAB=model 1, no auxState breakup fields -> the deferred
; oldStLocal init stays inert; see BUGS.md A18).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = ETAB

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3

[GPB-Phase1]
; ATLAS GPB regenerates INPUT/{phase.txt,properties.dat} from this section (committed as static fixtures)
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0

