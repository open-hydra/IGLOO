; etab-e2e-dopri5: etab-e2e under the explicit solver (ode-solver H-dopri5; INPUT symlinked to etab-e2e's).
; DOPRI5 hands the solver output callback its own state array where SDIRK4 hands a copy, so a product kick
; written into that array would reach the parcel twice. check.py runs etab-e2e's oracles on this run, then the
; same input under H-sdirk4 into ref-sdirk4/ and compares, drop by drop, the largest lateral speed.
; Everything below is etab-e2e's case with that one change.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-dopri5
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = ETAB

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3

[GPB-Phase1]
; ATLAS GPB regenerates INPUT/{phase.txt,properties.dat} from this section (committed as static fixtures)
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0
