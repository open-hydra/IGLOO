; khrt-varcp: the khrt-e2e case (KHRT breakup, ODE model 3) with a heat capacity that varies with temperature.
; INPUT/properties.dat (make_table.py) holds cp 4182 + 10 (T - 270) J/(kg K) on 1..1000 K, density 1000, the
; enthalpy its trapezoid sum; bc.txt is khrt-varrho's (kT 0.9), so the 270 K drops heat toward the 300 K gas.
; The particle state is the enthalpy and the temperature comes back through the table; a KH shed hands its child
; the parent's enthalpy, and the gas receives each segment's energy at the table's enthalpy. out-time writes the
; parcel time on every row. check.py: the energy handed to the gas telescopes, the stream mass flow is conserved,
; and the temperature follows the enthalpy history along the measured path.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on
[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9
[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = Reitz-KHRT
[IGLOO-BC]
ds = 10.0
[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3
[GPB-Phase1]
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182
[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall
[out]
type = outlet
[in]
type = inlet
krho = 0.34
dp   = 0.6e-3
[wall]
type = wall
q    = 0.0
