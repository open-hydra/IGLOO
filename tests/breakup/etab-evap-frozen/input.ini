; etab-evap-frozen: the etab-e2e case with evaporation switched on and frozen, so the drops integrate
; ODE model 2 with ETAB breakup events and a zero evaporation rate (Yinf 1: saturated far field).
; An event resizes the drop and its number rate together at constant stream mass and kicks its
; velocity; the run must reproduce the etab-e2e verdicts, the kick included, and hand the gas no
; mass. Water vapour properties; the gas and the drops are both at 300 K. INPUT is the etab-e2e
; case's; check.py runs its oracle plus the source gate.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = ETAB
evaporation = d2-law

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma               = 0.072
mu                  = 1.0e-3
Lv                  = 2.26e6
Mv                  = 18.0
boiling-temperature = 373.15
cpv                 = 1900.0
Le                  = 1.0
Yinf                = 1.0

[GPB-Phase1]
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0
