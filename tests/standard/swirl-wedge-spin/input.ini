; IGLOO end-to-end verification: an OVER-SPUN parcel on the axisymmetric annular WEDGE --
; the many-sector case of ledger O23 (companion of swirl-wedge / swirl-wedge-deposit;
; same fixture: INPUT is a symlink, delthe 1 deg, r in [0.19, 0.99], U=1, W=omega*y).
;
; One DB parcel at r = 0.2 with up = 0.05 (slow axially), wp = 2.0 (ten times the co-rotating
; speed): its azimuth advances by ~10 rad/s at injection, so it sweeps ~34 degrees before its
; (x, r) cell would end the first ODE segment. Before the fix a segment could span any number
; of 1-degree sectors, the fold (every segment end) rotated back by n*delthe at once, and
; the whole segment's deposit went to the dual cell located by (x, r cos theta) at the segment
; start -- a row inward of where the parcel actually was. Now the containment test carries
; the azimuth band, every segment ends at the sector edge (each fold rotates by exactly one
; sector), and the deposit lands where the parcel is.
;
; check.py: the run must report its fold count (one per sector swept, no multi-sector fold),
; every row must lie inside the sector, the trajectory must follow the Cartesian oracle of a
; Stokes parcel in the true field (r, v_r, w_p AND u, since u is no longer the clock), and the
; eulerian mass per geo cell must match the oracle's residence time projected with the
; solver's own dual-to-geo rule. gas-order 2 required; mollify off keeps each deposit in its
; cell; out-file ALL writes the fields. No equals sign inside comment lines.

[IGLOO-General]
mollify = off
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file = ALL

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.105
y     = 0.2
z     = 0.0
up    = 0.05
vp    = 0.0
wp    = 2.0
diam  = 6.0e-4
mdot  = 1.0e-4
temp0 = 300.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 1800
cp   = 1250

[BCB-Block1]
face1 = out
face2 = out
face3 = wall
face4 = wall
face5 = axisymmetric
face6 = axisymmetric

[out]
type = outlet

[wall]
type = wall
q    = 0.0
