; IGLOO end-to-end verification: SOLID-BODY SWIRL on an axisymmetric annular WEDGE.
;
; The gas field (INPUT/solfile.tec, generated by tools/make_wedge_case.py) embeds a
; one-cell-thick wedge (Nk=1 => mesh2D + axisym, delthe 1 deg; x[0,2] x r[0.19,0.99],
; 200x40 cells) carrying U=1, V=0, W=omega*y with omega=0.2 rad/s in the theta=0 frame:
; a solid-body swirl about the x axis, linear in y so the ord2 rebuild is exact.
; Three DB parcels on one axial station (cell centres, theta=0) with Stokes drag
; tau = rho_p d^2/(18 mu) = 1800*3.6e-7/3.24e-4 = 2 s (St = tau*omega = 0.4) and
; up = U = 1, so u == 1 for all t and t = (x - x0)/1 is the clock. wp gives each parcel
; its azimuthal velocity: P1 co-rotating (omega*r0), P2 spin-up (0), P3 over-spun
; (2*omega*r0). Every parcel spirals OUTWARD (centrifugal drift) and crosses many
; 1-degree sectors, so the wedge fold (axisymFold: position AND velocity rotated back
; by -n*delthe) runs on every parcel, every few segments.
;
; check.py integrates the exact cylindrical ODE of a Stokes parcel in the TRUE field
; (U, -omega z, +omega y) from the injection state and gates r(t), w_p(t), v_r(t) and
; the unwrapped azimuth against it, with tolerances that are a derived budget for the
; 2.5D frame error (the code samples the theta=0 components unrotated; W-plan section
; 2), NOT the print floor. Nothing here is a transcribed constant.
;
; gas-order 2 is REQUIRED (non-uniform gas). out-file S keeps the ODE system of the
; other box cases; the source output is not gated. No evaporation/breakup keys.
; INI traps: single spaces between values; no equals sign inside comment lines.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.105 0.105 0.105
y     = 0.5 0.5 0.3
z     = 0.0 0.0 0.0
up    = 1.0 1.0 1.0
vp    = 0.0 0.0 0.0
wp    = 0.1 0.0 0.12
diam  = 6.0e-4 6.0e-4 6.0e-4
mdot  = 1.0e-4 1.0e-4 1.0e-4
temp0 = 300.0 300.0 300.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 1800
cp   = 1250

[BCB-Block1]
face1 = out
face2 = out
face3 = wall
face4 = wall
face5 = axisymmetric
face6 = axisymmetric

[out]
type = outlet

[wall]
type = wall
q    = 0.0
