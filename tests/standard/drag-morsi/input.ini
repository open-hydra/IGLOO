; IGLOO end-to-end verification: the Morsi-Alexander drag law along a slip relaxation (check.py).
;
; drag-stokes's box and uniform gas (INPUT/solfile.tec is drag-stokes's: x[0,0.15] y[0,0.05] z[0,0.05], 60x5x5
; cells, rho = 1.2, U = 10, T = 600, mu = 1.8e-5) with 100 um particles: INPUT/bc.txt from
; tools/make_box_case.py INPUT --rp 5.0e-5 (kV = 0.1: v0 = 1 m/s along the gas, Tp0 = Tg). The slip Reynolds
; number falls from 60 to about 22 across the box, inside the band 10 < Re <= 100 of the coded fit. check.py
; integrates the slip ODE with the law typed in the check and compares every printed row at its printed time.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Morsi-Alexander
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 100e-6

[wall]
type = wall
q    = 0.0
