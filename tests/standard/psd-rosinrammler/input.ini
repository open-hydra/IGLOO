; psd-rosinrammler: the RosinRammler injection law of bc.txt column 8 against its CDF, Kolmogorov-Smirnov
; and Anderson-Darling at alpha = 1e-3 (check.py, shared with psd-table).
; RosinRammler: size parameter x0 = 2*rp = 30 um, spread n = sigmap = 2.5.
;
; psd-table's box and injection (INPUT/solfile.tec symlinked), bc.txt from tools/make_box_case.py
; --nx 1 --ny 200 --nz 100 --kv 1.0 --rp 1.5e-5 --law 2.5 RosinRammler: one parcel per inlet cell, 20 000 parcels.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-scatter = off
seed        = 42

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
fsample = 1

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
