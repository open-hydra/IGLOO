; scatter-placement: the scatter cloud's placement and weight on khrt-stress's case (the breakup/khrt-e2e fixture,
; INPUT symlinked, with mShedLim 0.01: hundreds of children and Rayleigh-Taylor shatters that multiply a parcel's
; number rate). out-file ALL writes the Eulerian number moment (euler1.tec) the markers' weights are summed
; against; out-time stamps the rows the weight's bound reads. See INFO.md.
[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = ALL
out-time    = on
[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9
[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = Reitz-KHRT
mShedLim    = 0.01
[IGLOO-BC]
ds = 10.0
[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3
[GPB-Phase1]
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182
[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall
[out]
type = outlet
[in]
type = inlet
krho = 0.34
dp   = 0.6e-3
[wall]
type = wall
q    = 0.0
