[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.125
y     = 0.5 0.7 0.9 1.1 1.3 1.5
z     = 0.025
up    = 0.2
vp    = 0.0
wp    = 0.0
diam  = 1.0e-3
mdot  = 1.0e-4
temp0 = 300.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 1620
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 1.0e-3

[wall]
type = wall
q    = 0.0

