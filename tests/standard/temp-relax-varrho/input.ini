; temp-relax-varrho: temp-relax-varcp's case (the same box, gas, inlet groups and varying cp) with a density that
; varies too: INPUT/properties.dat holds rho = 2950 - 0.5 (T - 250) kg/m3 on 250..800 K. A parcel without mass
; exchange keeps its mass, so its diameter follows the density, d = (6 m / (pi rho(T)))^(1/3), and so does its heat
; exchange. check.py: the temperature path against a quadrature of the energy balance with d(T), the printed
; diameter on every row against d(T), the constant mass.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 16.0e-6

[wall]
type = wall
q    = 0.0

