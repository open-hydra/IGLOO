; out-exit-row: a parcel that leaves the domain ends its trajectory at the exit, at either gas order and cadence.
;
; drag-stokes's case (INPUT symlinked: the box, 25 parcels from the inlet face at 1 m/s in a 10 m/s gas) with
; out-time on. check.py runs this input (gas order 1, a row at every cell crossing) and five siblings into
; ref-o<order>-<cadence>/: gas order 2 at the same cadence, and both gas orders at print-dcell 3 and at
; print-dtime 1e-3 s. In every run each exited parcel's last trajectory row is its exit record's position and
; time, and it is written once.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
