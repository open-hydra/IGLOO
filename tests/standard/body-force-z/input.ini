; IGLOO end-to-end verification: body-force drift ACROSS k-FACES (3D motion along z).
;
; body-force's box and parcels (kV = 1, kT = 1, Stokes) with the body acceleration along -z and a gas
; temperature that rises along z (T = 600 + 2000 z K at the cell centres, make_box_case.py --zgradient 2000):
;   tau = 1.287e-3 s, v_inf = g_z tau = -0.772 m/s, drift ~10.6 mm over the 15 ms crossing,
; so every parcel crosses at least one k-face (cells 10 mm thick) and the bottom row (z_c = 5 mm) leaves
; through z = 0. At gas-order 1 each parcel relaxes toward the temperature of the k-layer that holds it:
; check.py integrates T along the closed-form path with that layer's value, switched at the k-face planes,
; so a parcel placed in the wrong cell after a k-face crossing is seen. out-time stamps the rows.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on
body-accel  = 0.0 0.0 -600.0

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
