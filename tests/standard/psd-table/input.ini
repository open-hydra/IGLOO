; psd-table: a tabulated injection size distribution (bc.txt column 8 = INPUT/table6.dat) against
; its histogram CDF, Kolmogorov-Smirnov and Anderson-Darling at alpha = 1e-3 (check.py).
;
; Box from tools/make_box_case.py --nx 1 --ny 200 --nz 100 --kv 1.0 --rp 1.0e-4 --law 0.0 INPUT/table6.dat:
; one cell along x, a 200 x 100 inlet on face 1, uniform gas (U = 10 m/s, T = 600 K), parcels injected
; at the gas velocity and temperature. No ds, no mdot-max and fsample = 1: the cell-centre mode, one
; parcel per inlet cell, 20 000 parcels of equal mass flow. Column 7 (sigmap) is 0 and must not turn
; the table into a Dirac; column 6 (rp = 100 um) lies outside the table on purpose: the table sets the
; size and IGLOO prints one notice.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-scatter = off
seed        = 42

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
fsample = 1

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
