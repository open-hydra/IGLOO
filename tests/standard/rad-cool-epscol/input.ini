; IGLOO end-to-end verification: grey-body RADIATION with the emissivity a properties.dat column, eps(T) = T/3000
; (rad-cool's case otherwise: no [IGLOO-Properties] emissivity).
;
; The inlet moves the particles at the gas velocity (no slip: Stokes gives no force) and NoHeat removes the
; convective exchange, so radiation is the only heat exchange: a 30 um particle injected at 2400 K (kT 4) into the
; 600 K gas cools by eps(T) sigma pi d^2 (T_g^4 - T^4) alone, eps at the particle's own temperature. The column is
; above 1 from 3001 K and is cut to 1 there with one warning (rows the run never reaches). mollify off keeps the
; energy deposit per cell.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = NoHeat

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
