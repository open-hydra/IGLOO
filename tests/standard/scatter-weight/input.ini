; IGLOO end-to-end gate: the scatter cloud's marker count per parcel.
;
; drag-stokes's box, gas, inlet and parcels (INPUT symlinked): 25 streams of 11.89 um
; particles cross the 60 cells of the box, so every trajectory is cut at about sixty
; faces. out-time stamps each exit record with the parcel's residence time, from which
; check.py bounds the number of scatter markers each parcel may write.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
