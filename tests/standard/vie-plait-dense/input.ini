; IGLOO end-to-end verification: vie-plait's compressive field sampled by 250 face-injected strands (gas-order 2, 3D).
;
; vie-plait's mesh, gas and particle properties (INPUT/solfile.tec and INPUT/properties.dat are vie-plait's) with
; one parcel at the centre of each of the 250 cells of the inlet face x 0 (INPUT/bc.txt from tools/make_vie_case.py
; --kv 1.0 --rp 5.0e-4: the parcel starts at its cell's gas velocity, d 1 mm). Each strand follows vie-plait's
; damped oscillator from its own start; check.py also holds the source totals to the strands' momentum and
; kinetic energy flows.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 1620
cp   = 1250
