; IGLOO end-to-end verification: grey-body RADIATION of a hot particle to a cold gas on the shared box.
;
; The inlet moves the particles at the gas velocity (no slip: Stokes gives no force) and NoHeat removes
; the convective exchange, so radiation is the only heat exchange: a 30 um particle injected at 2400 K
; (kT 4) into the 600 K gas cools by eps sigma pi d^2 (T_g^4 - T^4) alone, and check.py compares every
; trajectory row with the closed form of that ODE in x. mollify off keeps the energy deposit per cell.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = NoHeat

[IGLOO-Properties]
emissivity = 0.8

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
