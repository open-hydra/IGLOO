; IGLOO end-to-end verification: ICE's emissivity key in the same input.ini does not reach IGLOO.
;
; drag-stokes's deck (INPUT is drag-stokes's) plus an [ICE-Physics] section holding emissivity, as a
; hydra case that runs both condensed solvers carries it, and no [IGLOO-Properties] section. IGLOO reads
; its emissivity from [IGLOO-Properties] only, so this run must equal drag-stokes's (check.py).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[ICE-Physics]
emissivity = 0.9

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
