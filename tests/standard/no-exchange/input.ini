; IGLOO end-to-end gate: the NoDrag and NoHeat model switches on an AXIS-ALIGNED BOX.
;
; Same uniform-gas box as drag-stokes (INPUT/solfile.tec is a symlink to its copy: gas
; U 10 m/s, T 600 K, 60x5x5 cells). INPUT/bc.txt comes from tools/make_box_case.py with
; --kv 0.1 --kt 0.5, so every parcel is injected with BOTH slips: 1 m/s against the gas's
; 10 m/s and 300 K against its 600 K. With drag NoDrag (Cd 0) and heat NoHeat (Nu 0) the
; velocity and temperature rates are exactly zero, so every parcel must cross the box
; with its injection velocity and temperature, and the momentum and energy exchange
; written to OUTPUT/source.tec must be identically zero. check.py builds that expectation
; from the inputs only. Any drag or heat law at all would move u toward 10 and T toward
; 600 within the first few cells.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = NoDrag
heat = NoHeat

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
