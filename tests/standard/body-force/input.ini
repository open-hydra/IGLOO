; IGLOO end-to-end verification: uniform BODY FORCE (generalized gravity) on a BOX.
;
; Third companion to drag-stokes / temp-relax. Same uniform-gas box, but a uniform
; transverse body acceleration g = (0, -200, 0) m/s^2 is added to every particle's
; dv/dt ([IGLOO-General] body-accel, Lib_RHS rhsStandard: F(4:6) += bodyAccel).
;
; Decoupling that gives a closed form:
;   - kV=1.0 => v0 = u_g exactly => STREAMWISE slip = 0 => u(t) == u_g for all t
;     (no x-body-force), so time maps to axial position as t = x/u_g.
;   - g is TRANSVERSE (-y). Stokes forces Cd=24/(Re+toll), toll=1e-20, so drag is
;     EXACTLY linear and component-wise: Fdrag_i = 3*pi*mu*d*(u_g,i - v_i) at ANY slip
;     magnitude/direction (Re/(Re+toll)=1 to machine eps). The y-momentum ODE is then
;         dv/dt = -v/tau + g_y,   tau = rho_p d^2 / (18 mu)          [linear]
;     with v0=0 => v(t) = v_inf (1 - e^{-t/tau}),  v_inf = g_y*tau (terminal drift).
;   - kT=1.0 => Tp0 = T_g => zero thermal slip => heat is a no-op (T_p == T_g); the
;     transverse motion leaves the heat balance untouched.
; With x=u_g*t this is a geometry/time-independent oracle v(x) verified by check.py:
;     v(x) = v_inf + (v_a - v_inf) exp(-(x - x_a)/(u_g*tau))   (anchored per particle)
;
; This case verifies the BODY-FORCE term wiring and its magnitude/sign: if bodyAccel
; were dropped or mis-signed the transverse velocity would stay 0 and the oracle fails.
; g_y=-200 keeps the terminal drift small (v_inf~=-0.257 m/s, max y-drift ~3.5mm < the
; 5mm clearance to the y=0 wall) so all 25 inlet particles traverse the full x-domain,
; exactly like the two green cases. gas-order=1, out-file=S (euler off; one-way).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
body-accel  = 0.0 -200.0 0.0

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

