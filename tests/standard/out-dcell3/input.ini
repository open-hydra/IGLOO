; IGLOO end-to-end verification: the trajectory row cadence print-dcell.
;
; drag-stokes's case (INPUT symlinked) with print-dcell = 3: a row at every third cell crossing (and at
; injection). check.py holds the rows to drag-stokes's closed form and to the rows of the plain run
; (print-dcell = 1, run into ref-plain/), and the exits and the source field to that run.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 3
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

