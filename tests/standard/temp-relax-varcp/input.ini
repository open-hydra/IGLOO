; temp-relax-varcp: temp-relax's box (uniform gas at 600 K, 10 m/s; kV = 1, so Re = 0, Nu = 2 and the parcels
; coast at u_g) with a VARYING cp on a table that starts above 1 K: INPUT/properties.dat spans 250..800 K,
; cp = 1000 + (T - 250) J/kg/K, rho 2950, the enthalpy its trapezoid sum. The particle state is then the
; enthalpy, and the temperature is recovered from it through the table. Four groups of inlet cells (bc.txt
; kT by row k): 210 K and 300 K (heating from below the table and inside it), 750 K (cooling inside it) and
; 840 K (cooling from above its end). d = 16 um. check.py: the piecewise closed form of the heating and
; cooling along the path, the exit temperatures, and the energy handed to the gas. mollify off keeps the
; source field unsmoothed.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 16.0e-6

[wall]
type = wall
q    = 0.0

