; IGLOO end-to-end verification: the Kavanau-Drake heat law on conv-nu's constant-slip state.
;
; conv-nu's box, inlet and body force (INPUT is conv-nu's): every parcel rides at its terminal
; velocity, so Re and the slip Mach number are constant and T relaxes exactly exponentially with
; tau_T from the law's printed form (NASA-SP-8039 Table II, ref. 72). out-time prints the parcel
; time, the clock of the oracle (check.py).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on
body-accel  = 0.0 -200.0 0.0

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Kavanau-Drake

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
