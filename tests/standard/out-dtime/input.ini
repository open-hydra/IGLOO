; IGLOO end-to-end verification: the time cadence print-dtime.
;
; drag-stokes's case (INPUT symlinked) with print-dtime = 1.0e-3 s and print-dcell = 1000000: a row at the
; first segment end at or past each multiple of the interval, and none from the crossing cadence (a row is
; written when either condition holds, so the crossing one is set out of reach). out-time stamps the rows; check.py
; holds them to the time rule and to drag-stokes's closed form.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1000000
print-dtime = 1.0e-3
out-time    = on
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

