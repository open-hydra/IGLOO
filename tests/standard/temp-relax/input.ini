; IGLOO end-to-end verification: TEMPERATURE relaxation (heat ODE) on an AXIS-ALIGNED BOX.
;
; Companion to drag-stokes. Same uniform-gas box (tools/make_box_case.py), but the
; inlet is tuned to DECOUPLE heat from drag so the heat ODE has a closed form:
;   - kV=1.0 => v0 = kV*|u_g| = u_g exactly => slip=0 => Re=0 along the whole path.
;     With Re=0, Ranz-Marshall Nu = 2 + 0.6*Re^0.5*Pr^(1/3) = 2 (conduction limit),
;     and drag Fdrag ~ Re*vrel = 0, so the particle coasts at u_g (pure +x, v const).
;   - kT=0.5 => Tp0 = kT*T_g = 300 K, a 300 K thermal slip below T_g=600 K that relaxes.
; Lumped-capacitance energy balance m*cp*dT/dt = h*A*(T_g-T_p), h=Nu*kg/d, A=pi*d^2,
; m=rho_p*(pi/6)*d^3 => dT_p/dt = (T_g-T_p)/tau_T, tau_T = cp*rho_p*d^2/(12*kg) = 1.67e-3 s.
; With x = u_g*t this gives a geometry/time-independent oracle T(x) verified by check.py:
;   T_p(x) = T_g + (T_a - T_g) * exp(-(x - x_a)/(u_g*tau_T))   (anchored at first point)
;
; This case verifies the HEAT-ODE integration and the Nu=2 conduction limit only; the
; convective term Nu(Re) is NOT exercised here (Re forced to 0) -- that belongs to the
; unit suite. gas-order=1, out-file=S (euler off; one-way coupled). ODE tol 1e-11 keeps
; the integrator ~3 orders below the F12.6 output floor (5e-7).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

