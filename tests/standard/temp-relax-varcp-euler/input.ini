; temp-relax-varcp-euler: temp-relax-varcp's run (INPUT is temp-relax-varcp's: a varying-cp table on
; 250..800 K, four inlet groups at 210, 300, 750 and 840 K, kV = 1 so every parcel coasts at u_g along its own
; column of cells) with the equivalent-Eulerian field written. Model 1 deposits int |v| dt and int h |v| dt per
; cell; the field's temperature is the table's T of their ratio, the time-mean enthalpy of the residence.
; out-time prints the parcel time that bounds each residence; mollify off keeps the field cell by cell.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = ALL
out-time    = on
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 16.0e-6

[wall]
type = wall
q    = 0.0

