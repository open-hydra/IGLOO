; drag-stokes integrated with the OTHER ODE solver IGLOO exposes: ode-solver = H-dopri5
; (explicit Dormand-Prince 5(4), OSlo wrap_dopri5). Every other fixture runs H-sdirk4, so
; until 2026-09-17 the token was accepted, wired through obj_IGLOO%setup and OSlo, and
; exercised by nothing (coverage audit G11). Same box, gas, inlet, parcels and closed-form
; Stokes oracle as drag-stokes (INPUT and check.py symlinked); only the integrator differs.
; The oracle's tolerance is the F12.6 print floor, so both integrators must meet it.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-dopri5
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

