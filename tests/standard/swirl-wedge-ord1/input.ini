; IGLOO end-to-end verification: SOLID-BODY SWIRL on the axisymmetric annular WEDGE at gas-order 1.
;
; swirl-wedge's case (INPUT is a symlink: delthe 1 deg, r in [0.19, 0.99], U=1, W=omega*y in the theta=0
; frame, three DB parcels at x = 0.105) sampled at gas-order 1: each parcel sees its cell's value, the
; meridian-frame velocity (U, 0, W_c) of the cell holding it, rotated to the parcel's azimuth (the ord1 2.5D
; rotation, Lib_Equations meridianToAzimuth). In cylindrical terms the gas has no radial component and the
; azimuthal component W_c of the cell, a constant per radial row that changes where the parcel crosses a
; radial face. check.py integrates swirl-wedge's cylindrical ODE with that piecewise swirl, switched at the
; face planes, and gates r, w_p, v_r and the unwrapped azimuth with swirl-wedge's tolerances.
; No equals sign inside comment lines.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.105 0.105 0.105
y     = 0.5 0.5 0.3
z     = 0.0 0.0 0.0
up    = 1.0 1.0 1.0
vp    = 0.0 0.0 0.0
wp    = 0.1 0.0 0.12
diam  = 6.0e-4 6.0e-4 6.0e-4
mdot  = 1.0e-4 1.0e-4 1.0e-4
temp0 = 300.0 300.0 300.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 1800
cp   = 1250
