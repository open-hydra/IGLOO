; IGLOO end-to-end verification: CONVECTIVE Ranz-Marshall Nu at constant Re (BOX).
;
; Fourth companion case. Same uniform-gas box + body force as body-force/, but the
; inlet injects each particle EXACTLY AT ITS TERMINAL VELOCITY:
;   v0 = (u_g, v_inf, 0),  v_inf = g_y*tau_v,  tau_v = rho_p d^2/(18 mu)
; realized via bc.txt col-2/3: kv = sqrt(u_g^2+v_inf^2)/u_g, alphap = atan(v_inf/u_g)
; (obj_particles initializePart: v = kv*|u_gas|*[cos a, sin a, 0]).
;
; The velocity state is then STATIONARY (drag_y balances g_y exactly, zero x-slip),
; so the slip is CONSTANT = |v_inf| => Re = rho_g |v_inf| d / mu = 0.204 constant =>
; Ranz-Marshall Nu = 2 + 0.6 Re^0.5 Pr^(1/3) = 2.2401 CONSTANT and > 2. kT=0.5 gives
; thermal slip; the heat ODE is exactly exponential with the CONVECTIVE tau_T:
;   tau_T = cp rho_p d^2/(6 Nu k_g) = 1.4918e-3 s   (10.7% SHORTER than the Nu=2 value)
; With x = u_g t (u == u_g for all t):
;   T(x) = T_g + (T_a - T_g) exp(-(x-x_a)/(u_g tau_T))
; This is the only e2e route to Nu(Re>0): tau_T/tau_v is mass/size-independent, so a
; "heavy particle" cannot freeze the slip — only body-force terminal velocity can.
; check.py guards v == v_inf and u == u_g at EVERY row (a drag/terminal-velocity error
; breaks the guard; a Nu wiring error misfits T(x) by ~11% of the exponent >> tol).
; Max y-drift = |v_inf|*Lx/u_g = 3.86mm < 5mm clearance: all 25 particles traverse.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
body-accel  = 0.0 -200.0 0.0

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

