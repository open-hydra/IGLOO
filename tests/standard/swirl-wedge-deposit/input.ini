; IGLOO end-to-end verification: the DEPOSIT twin of swirl-wedge (W-plan Q7, ledger O23).
;
; Same fixture, parcels and ODE settings as ../swirl-wedge (INPUT is a symlink); the two
; differences are the field outputs. out-file ALL writes BOTH the momentum source
; (OUTPUT/source.tec, the per-segment momentum exchange) and the eulerian field
; (OUTPUT/euler1.tec, the path-weighted parcel velocity), and mollify off keeps every
; deposit in the cell that received it, so check.py can split the fields by radius:
; P3 (r 0.30..0.35) is alone in its band, P1+P2 (r 0.50..0.53) in theirs.
;
; What is gated: the source is a meridian-plane field, so a parcel at azimuth theta must
; deposit its Cartesian momentum exchange in the (axial, radial, azimuthal) frame at its
; own azimuth -- Lib_Equations::toMeridian on the segment's (Pin - Pout) and on the euler
; moment states of every rhs. The oracle is the force on the gas integrated along the
; exact cylindrical trajectory, mdot*int (v - g)/tau dt, and the per-cell path average
; of (v_r, w). The trajectory gates of ../swirl-wedge run here too (the euler ODE states
; ride along in the same system; the trajectory is unchanged to the print floor).
; INI traps: single spaces between values; no equals sign inside comment lines.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file    = ALL
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.105 0.105 0.105
y     = 0.5 0.5 0.3
z     = 0.0 0.0 0.0
up    = 1.0 1.0 1.0
vp    = 0.0 0.0 0.0
wp    = 0.1 0.0 0.12
diam  = 6.0e-4 6.0e-4 6.0e-4
mdot  = 1.0e-4 1.0e-4 1.0e-4
temp0 = 300.0 300.0 300.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 1800
cp   = 1250

[BCB-Block1]
face1 = out
face2 = out
face3 = wall
face4 = wall
face5 = axisymmetric
face6 = axisymmetric

[out]
type = outlet

[wall]
type = wall
q    = 0.0
