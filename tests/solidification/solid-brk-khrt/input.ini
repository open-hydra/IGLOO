; IGLOO end-to-end verification: Reitz KH-RT breakup on a SOLIDIFYING material (ODE model 7).
;
; solid-brk-tab's box, inlet and material (INPUT is shared with it) under KH-RT: family 1 is molten
; and sheds KH children before it nucleates; family 2 enters 1 K above T-nuc, nucleates within a few
; microseconds and must shed nothing. Breakup acts on the liquid only (phases 0 and 1); a child is
; born in its parent's phase. out-file ALL writes the Eulerian field of model 7 (check.py K5).
; B0 0.2 (Reitz's 0.61 by default) puts the KH stable diameter at 7.5 um: a shed needs as many
; product drops as parent drops, which at the default 23 um takes 45 % of the mass, more than family 1
; loses before its RT breakup at about 95 us. The RT breakup cascades to sub-micron drops before they
; freeze (hence the Oh > 1 warning). check.py reads the scatter cloud at the default sampling (K6);
; the cascade saturates it at one marker per accepted step.

[IGLOO-General]
gas-file     = INPUT/solfile.tec
gas-order    = 1
print-dcell  = 1
out-file     = ALL
mollify      = off
out-time     = on
seed         = 42

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag    = Stokes
heat    = Ranz-Marshall
breakup = Reitz-KHRT
B0      = 0.2

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 1e-3
mu    = 1e-3

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
