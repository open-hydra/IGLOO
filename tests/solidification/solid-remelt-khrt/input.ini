; IGLOO end-to-end verification: a KH-RT drop that freezes, re-melts and breaks up (ODE model 7).
;
; solid-brk-khrt's material, drop and models in the box gas at 1500 K plus 20000 K/m along x: the drop enters
; 1 K above T-nuc and nucleates within microseconds; its plateau freezes, then melts once the gas passes T-melt,
; and re-melts near the end of the box. The re-melt restarts the KH-RT clock, so the first RT breakup follows it by
; tau_RT (check.py R1). B0 at its default: no KH shed. Rows at every segment end (print-dtime 1e-12, no print-dcell):
; the re-melt and the RT event each end a segment.

[IGLOO-General]
gas-file     = INPUT/solfile.tec
gas-order    = 1
print-dtime  = 1e-12
out-file     = S
out-scatter  = off
mollify      = off
out-time     = on
seed         = 42

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag    = Stokes
heat    = Ranz-Marshall
breakup = Reitz-KHRT

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 1e-3
mu    = 1e-3

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
