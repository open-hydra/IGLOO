; IGLOO end-to-end verification: SOLIDIFICATION (ODE model 6) driven by RADIATION alone on the shared box.
;
; solid-box's droplets made 10 um (bc.txt rp 5e-6) with NoHeat and an emissivity of 0.8: the grey-body
; term is the only heat exchange. Molten droplets at 2400 K cool as liquid, supercool to T-nuc 2300 K,
; recalesce to T-melt, hold the freezing plateau, then cool as solids, each regime in closed form in x
; (check.py). The inlet moves the droplets at the gas velocity (no slip: Stokes gives no force). mollify
; off keeps the energy deposit per cell.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = NoHeat

[IGLOO-Properties]
emissivity = 0.8

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 10.0e-6

[wall]
type = wall
q    = 0.0
