; IGLOO end-to-end verification: SOLIDIFICATION (ODE model 6) with a VARYING LIQUID HEAT CAPACITY on the shared box.
;
; solid-box's case (its boundary and phase files, symlinked) with its own INPUT/properties.dat: Cp = 1250 + 0.5 (T - 2400)
; J/(kg K) and the Enthalpy column its exact integral. The state stays the temperature; the liquid cools at the chord of
; the enthalpy table in the kelvin cell holding T, and the recalescence takes f0 from the table's enthalpy difference.
; mollify off keeps the energy source per cell (check.py E4b).
; plane-x: ten planes 200 um to 20 um before the nucleation point (x_n 0.033493 m), 20 um apart, and three on the
; freezing plateau (check.py S7).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off
plane-x     = 0.033293 0.033313 0.033333 0.033353 0.033373 0.033393 0.033413 0.033433 0.033453 0.033473 0.040 0.045 0.050

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
