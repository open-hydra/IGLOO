; IGLOO end-to-end verification: Reitz KH-RT breakup on a SOLIDIFYING material (ODE model 7) with a VARYING LIQUID
; HEAT CAPACITY and a VARYING DENSITY.
;
; solid-brk-khrt's case (solid-brk-tab's box, inlet and material, symlinked) with its own INPUT/properties.dat:
; Cp = 1250 + 0.5 (T - 2400) J/(kg K), the Enthalpy column its exact integral, and Density = 2950 + 0.5 (2400 - T)
; kg/m3. The state stays the temperature; the KH shed, a child's state, the event density and the breakup's
; properties read it as a temperature. out-file ALL writes the Eulerian field of model 7 (check.py K5).
; B0 0.2 puts the KH stable diameter at 7.5 um (solid-brk-khrt's INFO.md).

[IGLOO-General]
gas-file     = INPUT/solfile.tec
gas-order    = 1
print-dcell  = 1
out-file     = ALL
mollify      = off
out-time     = on
seed         = 42

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag    = Stokes
heat    = Ranz-Marshall
breakup = Reitz-KHRT
B0      = 0.2

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 1e-3
mu    = 1e-3

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
