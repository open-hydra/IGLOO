; IGLOO end-to-end verification: TAB breakup on a solidifying material with rho-solid (ODE model 6).
;
; solid-brk-tab's two inlet families with rho-solid 3660 kg/m3 on the material line of INPUT/phase.txt:
; the molten family breaks up while liquid, then freezes; the family injected 1 K above T-nuc freezes at
; once. A drop's mass changes only at a breakup event; a frozen drop keeps it and takes the diameter of its
; liquid and solid parts. The surface tension and viscosity are a fixture liquid. No check reads the
; scatter cloud.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off
out-time    = on
out-scatter = off
seed        = 42

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag    = Stokes
heat    = Ranz-Marshall
breakup = TAB
method  = 2
n       = 3.5

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 1e-3
mu    = 1e-3

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
