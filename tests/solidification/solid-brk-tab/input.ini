; IGLOO end-to-end verification: TAB breakup on a SOLIDIFYING material (ODE model 6, the event gated).
;
; Two inlet families of one alumina-like material (INPUT/phase.txt) enter the shared box at 35 m/s
; against the 10 m/s gas (slip 25 m/s, Re 50, We_r 11.25). Family 1 is molten (T0 four times the
; 600 K gas) and breaks up before it nucleates; family 2 enters 1 K above T-nuc and nucleates within
; a few microseconds, so it must never break up. Breakup acts on the liquid only (phases 0 and 1).
; The surface tension and viscosity are a fixture liquid chosen for the time scales. No check reads
; the scatter cloud.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off
out-time    = on
out-scatter = off
seed        = 42

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag    = Stokes
heat    = Ranz-Marshall
breakup = TAB
method  = 2
n       = 3.5

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 1e-3
mu    = 1e-3

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
