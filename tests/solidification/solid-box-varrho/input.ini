; IGLOO end-to-end verification: a varying liquid density table under solidification (ODE model 6), on solid-box's case.
;
; solid-box's box and inlet; INPUT/properties.dat carries a Density column 2950 + 0.5 (2400 - T) kg/m3
; (cp 1250, enthalpy 1250 T, 300 to 3000 K) and the material line no rho-solid, so the drop takes the
; table's density at its own temperature in every phase, at constant mass. The inlet decouples heat from
; drag as in temp-relax (Re 0, Nu 2). mollify off keeps the energy source per cell.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
