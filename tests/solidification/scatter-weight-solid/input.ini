; IGLOO end-to-end gate: the scatter cloud's marker count per parcel, solidifying drops.
;
; solid-box's box, gas, inlet, drops and solidification model (INPUT symlinked): 25 streams
; of molten 30 um drops coast at the gas speed through the 60 cells of the box while they
; supercool, recalesce, freeze and cool as solids (ODE model 6, a constant number rate).
; Each phase event cuts a step at the event and keeps the part of it before the event, so
; the parcel keeps that part of the step's scatter weight. out-time stamps each exit
; record with the parcel's residence time; check.py is scatter-weight's.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
