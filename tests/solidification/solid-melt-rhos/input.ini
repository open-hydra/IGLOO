; IGLOO end-to-end verification: MELTING at constant mass with the solid density (rho-solid), on solid-melt's case.
;
; solid-melt's box (the gas at 3000 K), inlet and material with rho-solid 3660 kg/m3 on the material line of
; INPUT/phase.txt, against the liquid's 2950 kg/m3 (common/properties.dat). The particles enter frozen (T0 at half
; the gas temperature, below T-nuc) at the injected 30 um, so their mass is that of a 30 um sphere at rho-solid;
; the mass is constant, and the diameter grows on the melting plateau from 30 um to the liquid 32.236 um. The inlet
; decouples heat from drag as in temp-relax (Re 0, Nu 2). mollify off keeps the energy source per cell.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
