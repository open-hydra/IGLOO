; IGLOO e2e: DB ("assigned position") injection on the uniform-gas BOX.
;
; The pin-time velocity hand-off: pin_particles' DB branch stores the requested
; velocity in the particle's vInj field (stateVar(4:6) is allocated later, by
; setup_particleODE), and integrate's init hands it off. This case exercises BOTH
; DB velocity paths:
;   - explicit up/vp/wp  -> vInj carries the request into stateVar(4:6)
;   - (sentinel default would take the gas velocity; covered implicitly by
;     the same hand-off logic)
; 5 particles at interior positions, v0=(1,0,0), Stokes drag: each relaxes
; to u_g=10 exactly as in drag-stokes; check.py asserts placement fidelity,
; the vInj hand-off (first-row u == up), and outlet exits.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.01 0.01 0.01 0.01 0.01
y     = 0.005 0.015 0.025 0.035 0.045
z     = 0.025
up    = 1.0
diam  = 11.89e-6
mdot  = 1.0e-4
temp0 = 300.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

