; IGLOO end-to-end verification: the give-up guard of a parcel that does not move.
;
; drag-stokes's box with the gas at rest and every inlet cell coded 402 at rest (make_fixture.py): the parcels
; start at x = 0 with no velocity in a stagnant gas, no force acts on them and they never leave their cell.
; The integration loop counts the segments a parcel spends in one cell and gives up past ten of them
; ('stuck in cell'), long before the zero-progress guard (a hundred segments) or the outer cap. check.py
; holds the run to exactly that exit, once per parcel, at the injection point.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
