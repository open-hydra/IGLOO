; IGLOO end-to-end verification: an inlet cell that injects nothing pins no parcel.
;
; two-fam-bc's case (drag-stokes's box and gas, materials A and B, one centred parcel per inlet cell) with its bc.txt's
; field 1 as ATLAS writes it when family A loads krho 0.34 on rows j = 3-5 only and family B has no inlet keys (its
; 401 of krho 0, a phase without keys at an inflow grain): A's rows 1-2 and all of B inject nothing. check.py gates
; that no zero-mass parcel is pinned, and the parcels of the loaded cells.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
out-file    = S
out-time    = on
print-dcell = 1

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[GPB-Phase2]
type = condensed-dispersed
rho  = 1000
cp   = 1250
