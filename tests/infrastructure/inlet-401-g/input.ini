; IGLOO end-to-end verification: the 401 inlet's 10th field G, the fixed mass flux of the cell (ATLAS's mixture rule
; over the dispersed phases: the sum of gp over the cell's 402/403 records, the gas not in it).
;
; drag-stokes's box, gas and 401 inlet with G = rho_g U = 12 kg/(m^2 s) on every inlet line (INPUT/bc.txt from
; make_fixture.py), no ds and inj-mdotmax's mdot-max 0.25 g/s: each 1 cm inlet cell carries field 1 (mdot_gas + G A),
; twice drag-stokes's flow, and the placement asks for 5 parcels per cell where inj-mdotmax asks for 3. check.py gates
; the exit mass flow and the cap.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on
mdot-max    = 0.25

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 0.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
