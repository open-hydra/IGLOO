; solver-fail-refine: the ODE solver gives up on a refinement call, with the Eulerian output on.
;
; solver-fail-midway's box (INPUT symlinked, tools/make_box_case.py --kv 1.0 --u2 5 --rp 1.0e-6): 25 parcels of
; 2 um injected at the gas velocity, 10 m/s in the first cell. With max-steps-ode 10 every parcel's solver steps
; grow until one crosses the face of the first cell (x 0.0025 m); the crossing interrupts the call, and the call
; that integrates the cut step again runs out of steps (err -1). The parcel ends at its last accepted step, inside
; the first cell. check.py: the exit record lies in that cell, the Eulerian mass in the field equals the exit
; records' sum of mdot times t, and a sibling run with a body acceleration along x (ref-g) closes the momentum
; source on the drag reaction plus the impulse over the residence.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = ALL
out-time    = on
mollify     = off

[IGLOO-ODE]
ode-solver    = H-sdirk4
max-steps-ode = 10

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 2.0e-6

[wall]
type = wall
q    = 0.0
