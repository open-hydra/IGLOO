; two-fam-bc-2blk-mollify: two-fam-bc-2blk's case (INPUT symlinked) with the field mollifier at
; its default, 8 binomial passes.
;
; The box of two blocks joined by a 101 connection at x 0.075 m, two families in ATLAS order, one
; centred parcel per inlet cell; every parcel crosses the interface. The mollifier smooths the
; source and eulerian fields; check.py holds them, cell by cell, to the same box run as one block
; with the same input.ini, so the smoothing must carry its flux across the block interface as it
; does across an interior face.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
out-file    = ALL
print-dcell = 1

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[GPB-Phase2]
type = condensed-dispersed
rho  = 1000
cp   = 1250
