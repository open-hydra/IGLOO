; Fixture for test_ini_pipeline: complete valid IGLOO input.ini (copy of the
; working e2e conv-nu case) + TAB breakup with ALL model options left to their
; defaults, so the test pins the INI->module-variable defaulting pipeline
; (incl. the intentional WeCrit doubling and the Rosin-Rammler scale factor).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
body-accel  = 0.0 -200.0 0.0

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag    = Stokes
heat    = Ranz-Marshall
breakup = TAB
blowing = LK

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

