; two-fam-bc-2blk: two-fam-bc's case on the same box split into TWO BLOCKS at x 0.075 m.
;
; The gas and materials are two-mat's: drag-stokes's box (x 0..0.15 m, uniform gas rho 1.2,
; U 10, T 600, mu 1.8e-5; face 1 of block 1 the inlet, 25 cells), materials A (rho_p 2950) and
; B (rho_p 1000) from two-mat's phase.txt and two-zone properties.dat, drag Stokes, one centred
; parcel per inlet cell. INPUT/solfile.tec holds two zones of 30 x 5 x 5 cells written by
; tools/make_box_case.py with two blocks; INPUT/bc.txt (make_fixture.py) holds each block's face
; table once per family in the order ATLAS BCB writes a phase with several (material,
; population) pairs -- block-outermost, then material-major, population-minor -- so the file is
; block 1 A, block 1 B, block 2 A, block 2 B. Face 2 of block 1 and face 1 of block 2 are a 101
; connection whose line names the partner cell, so every parcel leaves block 1 through the
; interface and finishes its relaxation in block 2.
;
; Read per family and per block, the run reproduces two-fam-bc on one block: the same parcels,
; exits, scatter samples and cell fields. check.py runs that one-block sibling itself. The field
; mollifier is off: it smooths each block with zero-flux block boundaries, a 101 face included,
; so with it on the cells within its width of the interface differ from the one-block run.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
out-file    = ALL
print-dcell = 1
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[GPB-Phase2]
type = condensed-dispersed
rho  = 1000
cp   = 1250
