; exit-census: every parcel whose integration stops leaves one exit record, whatever stopped it.
;
; drag-stokes's box (INPUT symlinked: uniform gas at 10 m/s along +x) with seven assigned streams at the gas
; velocity and time-end 5e-3 s: IDs 1-3 start at x 0.14 m and leave through the outlet before time-end, IDs 4-6
; start at x 0.004 m and are inside the box at time-end, ID 7 starts outside the box (x -0.01 m), where no cell
; holds its injection point, and is not integrated. check.py: one exit record per injected parcel; the outlet
; ones with code 400, the others with code 0 where the integration stopped (the time-end state, the snapshot's;
; the injection point at t 0 for the parcel never integrated).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on
time-end    = 5.0e-3

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.14 0.14 0.14 0.004 0.004 0.004 -0.01
y     = 0.015 0.025 0.035 0.015 0.025 0.035 0.025
z     = 0.025
up    = 10.0
diam  = 11.89e-6
mdot  = 1.0e-4
temp0 = 600.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
