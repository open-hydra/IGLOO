; two-fam-bc: a particle boundary file with ONE COPY OF THE INLET TABLE PER FAMILY.
;
; The box, gas and materials are two-mat's: drag-stokes's 60x5x5 box (x 0..0.15 m, uniform gas
; rho 1.2, U 10, T 600, mu 1.8e-5; face 1 the inlet, 25 cells), materials A (rho_p 2950) and
; B (rho_p 1000) from two-mat's phase.txt and two-zone properties.dat, drag Stokes, one centred
; parcel per inlet cell. What differs is INPUT/bc.txt (make_fixture.py): the block's face table
; is written twice, in the order ATLAS BCB writes a phase with several (material, population)
; pairs -- block-outermost, material-major, population-minor -- so copy 1 is family 1 (A) and
; copy 2 is family 2 (B). A carries drag-stokes's inlet line (krho 0.34, rp 5.945e-6), B half the
; loading and twice the radius (krho 0.17, rp 1.189e-5). The headers follow ATLAS's "b i j k f
; code" layout, unlike the box generators' "b f m n 1 code".
;
; Read per family, B injects d 23.78 um and each family carries mdot krho/(1 - 0.51) x 1.2e-3
; kg/s. Read as one copy fed to every family, B would inject A's 11.89 um parcels and both would
; carry 0.34/(1 - 0.68) x 1.2e-3. check.py derives every number from these inputs.
;
; ATLAS reads one key set for every material of a phase, so two MATERIALS with different inlet
; payloads cannot come from it; two populations of one material can (a vector key per phase).
; The reader sees only the family count; two materials are used here so that each family has its
; own output files and its own closed-form oracle. No [BCB-*] or patch sections for that reason.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
out-file    = ALL
print-dcell = 1

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[GPB-Phase2]
type = condensed-dispersed
rho  = 1000
cp   = 1250
