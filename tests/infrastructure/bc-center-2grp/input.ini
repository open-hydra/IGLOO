; IGLOO regression case: the bc_center pinning path with TWO particle groups.
;
; Fixture = standard/drag-stokes (uniform-gas box, INPUT/ symlinked to it) with two
; deliberate changes, each of which is load-bearing:
;
;   1. NO `ds` in [IGLOO-BC]. pin_particles dispatches on
;      `method=='FB' .and. ds==0 .and. mdotMax==0 .and. .not.dsSwitch`, so dropping ds
;      is what selects pin_particles_bc_center over pin_particles_bc_ds. Every other
;      case in the suite sets ds (20 of them) or injects from an assigned/DB stream
;      (3), which is why this routine went untested long enough to accumulate a
;      silent out-of-bounds write (BUGS.md A24).
;
;   2. `fsample = 2` and INPUT/phase.txt `A 2`. The defect has TWO halves and each
;      needs its own trigger:
;        - >= 2 groups: pin_particles runs once per (material, group), and the
;          particle-index counter was implicit-SAVE, so group 2 resumed from group 1's
;          final value and wrote past the end of its own freshly allocated array.
;        - fsample > 1: the cell counter was implicit-SAVE too, so the COUNTING pass
;          started from the carried value and mod(nn,fsample) shifted phase, sizing
;          the array differently from what the fill pass writes.
;      With fsample = 1 the second half is invisible (mod(nn,1) == 0 always). Do not
;      "simplify" this back to the default.
;
; 5x5 = 25 inlet cells on face 1, every 2nd one taken => 12 particles per group, 24
; total. Physics is drag-stokes' and is gated there; this case gates PINNING only.
; See INFO.md for the measured pre-fix signatures.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
fsample = 2

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
