; sym-plane-skate: parcels launched along a symmetry plane, slow and fast, at gas order 1 (census control).
;
; drag-stokes's box (solfile.tec symlinked: uniform gas along +x at U 10 m/s, w 0) with face 5 (z 0) a
; symmetry plane (300) and no inlet: tools/make_box_case.py --sym-face 5 --no-inlet writes INPUT/bc.txt.
; Twelve assigned streams start at x 0.004 m, z 1e-4 m, three per (speed, incidence) on y 0.015, 0.025,
; 0.035 m: 0.1 m/s at 1 and 10 degrees (IDs 1-6), 50 m/s at 1 and 10 degrees (IDs 7-12), heading
; toward the plane. SDIRK4 at its default tolerances. check.py: no give-up guard fires, every parcel
; leaves through the outlet (x 0.15 m), the 1-degree fast streams slide on the plane (grazing), the
; 10-degree ones leave reflected, the slow ones stop short of the plane.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver = H-sdirk4

[IGLOO-Models]
drag = Schiller-Naumann
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.004
y     = 0.015 0.025 0.035 0.015 0.025 0.035 0.015 0.025 0.035 0.015 0.025 0.035
z     = 1.0e-4
up    = 0.09998476952 0.09998476952 0.09998476952 0.0984807753 0.0984807753 0.0984807753 49.99238476 49.99238476 49.99238476 49.24038765 49.24038765 49.24038765
wp    = -0.001745240644 -0.001745240644 -0.001745240644 -0.01736481777 -0.01736481777 -0.01736481777 -0.8726203219 -0.8726203219 -0.8726203219 -8.682408883 -8.682408883 -8.682408883
diam  = 11.89e-6
mdot  = 1.0e-4
temp0 = 600.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = wall
face2 = out
face3 = wall
face4 = wall
face5 = sym
face6 = wall

[out]
type = outlet

[wall]
type = wall
q    = 0.0

[sym]
type = symmetry
