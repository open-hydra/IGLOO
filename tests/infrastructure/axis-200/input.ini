[IGLOO-General]
gas-file = INPUT/solfile.tec
print-dcell = 1
out-file = e

[IGLOO-Models]
drag = Morsi-Alexander
heat = Kavanau-Drake

; Two DB-injected particles on the SAME axial station in the converging section:
;   ID 1 -- near-axis, injected just inside the first radial cell (whose outer edge
;           sits at r ~ 5.6e-3 here) and given a genuine INWARD radial velocity.
;           That vp is NOT decoration. With the axis dual ghost corrected, the gas
;           radial velocity vanishes ON the axis, as it must, so an equilibrium parcel
;           only approaches it asymptotically -- measured r_min ~ 0.24 * y0 at every
;           injection radius tried -- and never touches the bcdef-200 face. Without vp
;           this case silently stops exercising the axis reflection it exists to test:
;           MEASURED 25 axis-face reflection events with vp, 0 without.
;   ID 2 -- off-axis control at db-2daxi's radius; it never approaches the axis, so a
;           failure is identifiably axis-specific and not a broken case. Its up/vp are
;           pinned at its measured gas-velocity injection state, so it behaves exactly
;           as it did under the sentinel default (omitting vp for it is not an option:
;           an absent component is filled with 0, not with the gas value).
;
; Two INI-parsing traps, both measured on this file, both silent-or-fatal:
;   * keep multi-value options SINGLE-space separated. Two or more spaces make
;     count_values overcount, and the run error-stops on "components have diffent
;     sizes" -- or, worse, drops the option and injects a zero component.
;   * no '-equals-' sign inside a ';' comment line: FiNeR tries to parse such a line
;     as an option, prints "ERROR: parse ... failed!" to stderr, and a malformed line
;     can silently drop options that follow it. This file used to emit exactly that on
;     every run (191 bytes of stderr, exit 0, nothing gating it).
[IGLOO-BC]
x = -0.49 -0.49
y = 1.0e-4 0.55
diam = 2.0e-5 2.0e-5
mdot = 1.0 1.0
up = 78.858149 7.521874
vp = -1.0 -3.349168

[GPB-Phase1]
type = condensed-dispersed
rho = 2500
cp = 1250

; face3 is the axis. db-2daxi tags it `sym` (-> bcdef 300); this case tags it
; `axisymmetric` (-> bcdef 200), which is what ATLAS emits for `axisymmetric` and what
; the JPL nozzle cases use. bc.txt is db-2daxi's with the 200 face-3 entries retagged.
[BCB-Block1]
face1 = in
face2 = out
face3 = axisymmetric
face4 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.5
dp = 20e-6

[wall]
type = wall
q = 0.0
