[IGLOO-General]
gas-file = INPUT/solfile.tec
print-dcell = 1
out-file = e

[IGLOO-Models]
drag = Morsi-Alexander
heat = Kavanau-Drake

; Two DB-injected particles on the SAME axial station in the converging section:
;   ID 1 -- near-axis (y = 1e-4, inside the first radial cell, whose outer edge is
;           r ~ 5.6e-3 here). The converging flow carries it onto the axis, which is
;           the whole point of this case.
;   ID 2 -- off-axis control at db-2daxi's radius; it never approaches the axis, so it
;           proves a failure is specific to the axis path and not a broken case.
[IGLOO-BC]
x = -0.49 -0.49
y = 1.0e-4 0.55
diam = 2.0e-5 2.0e-5
mdot = 1.0 1.0

[GPB-Phase1]
type = condensed-dispersed
rho = 2500
cp = 1250

; face3 is the axis. db-2daxi tags it `sym` (-> bcdef 300); this case tags it
; `axisymmetric` (-> bcdef 200), which is what ATLAS emits for `axisymmetric` and what
; the JPL nozzle cases use. bc.txt is db-2daxi's with the 200 face-3 entries retagged.
[BCB-Block1]
face1 = in
face2 = out
face3 = axisymmetric
face4 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.5
dp = 20e-6

[wall]
type = wall
q = 0.0
