; two-fam-bc-2blk-stretch-ord2: the box as two blocks of unequal cells joined by a 101 face, gas-order 2.
;
; INPUT/ is tools/make_box_case.py --blocks 2 --stretch 2 --gradient 1000 --families 2: block 1 holds 30
; cells of 1.667 mm along x (x 0..0.05 m), block 2 30 cells of 3.333 mm (x 0.05..0.15 m), 5 x 5 cells
; across; uniform gas (rho 1.2, U 10) but T = 600 + 1000 x K. Two populations of material A in ATLAS's
; family order. Under gas-order 2 the ghost nodes of the 101 faces are interpolated from the other
; block's gas; check.py holds the run to the same cells as one block.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
out-file    = ALL
print-dcell = 1
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
