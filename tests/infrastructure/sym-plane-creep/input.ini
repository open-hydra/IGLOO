; sym-plane-creep: sym-plane-bounce's parcels in a 3 mm/s gas, at gas order 1 (the progress guard).
;
; tools/make_box_case.py --sym-face 5 --no-inlet --ug 0.003 writes INPUT/solfile.tec: drag-stokes's box with the
; gas at 3 mm/s along +x; INPUT/bc.txt is sym-plane-skate's (face 5, z 0, a symmetry plane, code 300; no inlet).
; Six assigned streams start at x 0.004 m, z 1e-4 m, three per incidence on y 0.015, 0.025, 0.035 m: 0.1 m/s
; at 1 degree (IDs 1-3) and at 10 degrees (IDs 4-6) toward the plane, under a body acceleration of 9.81 m/s2
; onto it. Each parcel lands in its injection cell and creeps along the plane by far less than one grazing
; standoff (1e-6 m) per reflection. check.py: every 100 reflections the progress guard finds the parcel less
; than 1e-4 m from its previous checkpoint and ends it as stuck in the cell where it landed, code 0, on the
; plane. print-dcell 1 gives the gas-order-2 twin a trajectory row at every reflection.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on
body-accel  = 0.0 0.0 -9.81

[IGLOO-ODE]
ode-solver = H-sdirk4

[IGLOO-Models]
drag = Schiller-Naumann
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.004
y     = 0.015 0.025 0.035 0.015 0.025 0.035
z     = 1.0e-4
up    = 0.09998476952 0.09998476952 0.09998476952 0.0984807753 0.0984807753 0.0984807753
wp    = -0.001745240644 -0.001745240644 -0.001745240644 -0.01736481777 -0.01736481777 -0.01736481777
diam  = 11.89e-6
mdot  = 1.0e-4
temp0 = 600.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = wall
face2 = out
face3 = wall
face4 = wall
face5 = sym
face6 = wall

[out]
type = outlet

[wall]
type = wall
q    = 0.0

[sym]
type = symmetry
