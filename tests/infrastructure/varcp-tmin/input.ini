; varcp-tmin: a VARYING cp on a table that starts above 1 K and ends below the parcels' temperature.
; Box, gas and inlet of standard/drag-stokes (INPUT/bc.txt and INPUT/solfile.tec linked there); the
; material A reads INPUT/properties.dat, 280..380 K, cp = 1250 + (T - 280) J/kg/K, rho 2950, the enthalpy
; its trapezoid sum. The parcels enter at the gas temperature, 600 K, on the table's extended last segment,
; so their enthalpy state must map back to 600 K all along. check.py: drag-stokes's oracle for the motion,
; T = 600 K on every row and exit record, the enthalpy-state witness.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
