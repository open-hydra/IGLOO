; IGLOO end-to-end verification: the GAS-ORDER-2 DUAL MESH across a TRANSLATIONAL PERIODIC face (bcdef 201).
;
; periodic-2d-ord2's one-layer box and physics (kV 1, Stokes, Ranz-Marshall, g_y -8000 m/s^2, the temperature
; wave T_c(y_c) of 600 + 100 cos(2 pi y_c/Ly) across the periodic direction, parcels injected at kT 0.5), written over
; TWO periods of Ly along y: 60 x 50 x 1 cells over 0.15 x 0.10 x 0.05 m, faces 3/4 a 201 pair, one parcel per
; inlet cell, each with a twin one period away. At gas-order 2 the source and eulerian deposits live on the dual
; mesh centred on the vertices; a vertex on the 201 face is one dual cell across the period, held by the cells
; on both sides of the seam. The fields then have period Ly: check.py holds the cells next to the seam (y 0 and
; 2 Ly) to the cells one period away (next to y Ly, an interior vertex row), the mollifier off.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file    = ALL
out-time    = on
mollify     = off
body-accel  = 0.0 -8000.0 0.0

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
