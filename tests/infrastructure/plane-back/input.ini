; plane-back: parcels that turn back through the plane-crossing planes.
;
; drag-stokes's box with the gas at rest (stuck-cell's gas file) and every inlet cell coded 402 at 10 m/s along the
; inward normal (+x), 600 K, a 1.0 kg/(m2 s) mass flux; drag-stokes's parcel (11.89 um, rho 2950, Stokes drag,
; tau_p 1.2872 ms) under a body acceleration of 1000 m/s2 toward -x. Each parcel decelerates, turns at
; x 9.2745 mm (cell 4) and comes back to the inlet face, where it leaves (code 402). The three planes, mid-cell, on a
; cell face and mid-cell, are each crossed forward and then backward. out-time writes the parcel time on every row.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on
body-accel  = -1000.0 0.0 0.0
plane-x     = 0.00125 0.0025 0.00625

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
