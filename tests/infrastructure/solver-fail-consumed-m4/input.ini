; solver-fail-consumed-m4: the solver-fail-consumed case with an ODE breakup model switched on, so
; the drops integrate ODE model 4. The ODE tolerances are 1e-30, below double precision, so SDIRK4
; gives up on the first step of every parcel (err < 0) and each dies at injection carrying its full
; mass, which must reach the gas as it does for model 2. kv 1: the breakup rate is exactly 0.
; INPUT is tc-hexadecane's, check.py is solver-fail-consumed's.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-30
absolute-tol = 1e-30

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = TC
interface   = VLE
breakup     = Reitz-Diawakar

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3
Lv    = 2.58e5
Mv    = 226.45
Tboil = 560.0
cpv   = 2300.0
Le    = 2.5
Yinf  = 0.0

[GPB-Phase1]
type    = condensed-dispersed
rho     = 8000
cp      = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 20.0e-6

[wall]
type = wall
q    = 0.0
