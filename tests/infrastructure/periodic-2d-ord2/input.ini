; IGLOO end-to-end verification: TRANSLATIONAL PERIODIC faces (bcdef 201) at GAS-ORDER 2.
;
; periodic-2d's one-layer box (60 x 25 x 1 cells, faces 3/4 a 201 pair) and physics (kV = 1, Stokes,
; g_y = -8000 m/s^2: about 2.8 wraps of Ly per parcel), with a temperature wave across the periodic
; direction, T_c = 600 + 100 cos(2 pi y_c/Ly) at the cell centres, and parcels injected at kT = 0.5.
; At gas-order 2 the gas is sampled on the dual mesh, whose nodes beyond faces 3/4 are ghosts: a
; periodic face's ghost must carry the partner side's gas (the periodic extension of the field),
; not the ring's linear extrapolation. check.py integrates T(t) along the closed-form path through
; the periodic extension of the cell-centre field and holds every row to it.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file    = S
out-time    = on
body-accel  = 0.0 -8000.0 0.0

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
