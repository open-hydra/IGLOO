; psd-bare-token: bc.txt column 8 names a size-distribution file with neither a '.' nor a '/' in its
; name -- `psd`, in the case directory (the working directory of the run). A token that is not a law
; name is a file when one exists under it (as written, then INPUT/ + its basename); its shape does not
; matter. The table has one row (radius 12 um), so every parcel is injected at d = 24 um exactly,
; against the 11.89 um of column 6 (rp, ignored by a table; one notice).
; Otherwise drag-stokes's case: its box and gas (INPUT/ links), 25 parcels.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
