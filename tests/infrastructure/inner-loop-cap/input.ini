; inner-loop-cap: every parcel reaches the inner loop's cap on the first cell past a mesh stretch.
;
; A box (tools/make_box_case.py --kv 1.0 --rp 1.0e-6 --stretch 1000) of 60 cells along x over 0.15 m: the left
; 30 cells 4.995e-6 m long, the right 30 cells 1000 times longer; the gas uniform at 10 m/s and 600 K; 25 parcels
; of 2 um injected at the gas velocity and temperature (no slip, no heat exchange: every accepted state has
; x equal to u_g times t). A crossing takes one solver call per decade of the cell length over 1e-8 m: four calls
; in a left cell, seven in the first right cell. [IGLOO-ODE] max-inner-iter 5 lets the left half finalize and caps
; every parcel on its first right cell. check.py: the cap fires once per parcel there, and the Eulerian mass
; equals the exit records' flow over the residence up to the cell entry.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = ALL
out-time    = on
mollify     = off

[IGLOO-ODE]
ode-solver     = H-sdirk4
max-inner-iter = 5

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 2.0e-6

[wall]
type = wall
q    = 0.0
