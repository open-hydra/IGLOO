; solver-fail-midway: the ODE solver gives up on a segment after finalized ones, with the Eulerian output on.
;
; A box (tools/make_box_case.py --kv 1.0 --u2 5 --rp 1.0e-6) whose gas runs at 10 m/s up to x 0.075 m and at
; 5 m/s beyond; 25 parcels of 2 um injected at the gas velocity (no slip, a handful of solver steps per segment).
; At the jump a parcel relaxes to the slower gas with a relaxation time of 3.6e-5 s against 2.5e-4 to 5e-4 s to
; cross the cell: SDIRK4 needs more than max-steps-ode (60) steps on that segment and gives up (err -1). Every
; parcel ends there, with the time of its last finalized segment. check.py: the Eulerian mass in the field
; equals the exit records' sum of mdot times t (model 1 deposits the flow over the residence), so the failed
; segment deposits nothing. The segments before the jump need at most 12 steps, the jump segment more than 340.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = ALL
out-time    = on
mollify     = off

[IGLOO-ODE]
ode-solver    = H-sdirk4
max-steps-ode = 60

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 2.0e-6

[wall]
type = wall
q    = 0.0
