[IGLOO-General]
gas-file = INPUT/solfile.tec
print-dcell = 1
out-file = e

[IGLOO-Models]
drag = Morsi-Alexander
heat = Kavanau-Drake

; Two DB-injected parcels in the mid-plane (z 0.0025) of a 0.1 x 0.1 x 0.005 m box with
; ONE cell across z (mesh2D). Uniform gas, u 5 m/s along x, v and w zero; the parcels start
; at the gas velocity, so nothing but the k-face geometry can move them off their y and z.
; ID 1 at y 0.025 and ID 2 at y 0.075 sit at different radii from the x axis, which is what
; separates a slab (parallel k-planes) from a wedge (k-planes through the axis).
; No '-equals-' inside a ';' comment line: this checkout's FiNeR parses it as an option.
[IGLOO-BC]
x = 0.005 0.005
y = 0.025 0.075
z = 0.0025 0.0025
diam = 2.0e-5 2.0e-5
mdot = 1.0 1.0
up = 5.0 5.0
vp = 0.0 0.0
wp = 0.0 0.0

[GPB-Phase1]
type = condensed-dispersed
rho = 2500
cp = 1250

; Face 2 (x max) is an outlet (bcdef 400); the five others are symmetry planes (300),
; INCLUDING the two z faces: a slab is a planar 2D case, not a wedge.
[BCB-Block1]
face1 = symmetry
face2 = extrapolation
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry
