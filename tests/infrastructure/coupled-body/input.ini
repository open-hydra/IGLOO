; IGLOO end-to-end verification: EULER + SOURCE + BODY-FORCE combined path on a BOX.
;
; Same physics as standard/body-force (transverse g, Stokes exact-linear drag,
; kV=kT=1 decoupling => closed-form v(x)), but with BOTH output fields active:
; out-file is deliberately ABSENT so Lib_INI falls into the default branch and
; switches on euler AND source together with bodyForce — the accumulator
; combination the 2026-07 merge shipped untested (model 1: euler slots F(8:12)
; plus the closed-form body-force source-reaction correction at deposition,
; Lib_Integration case default: Pin += mdot*Tstay*g, Ein += mdot*g.(x-x0)).
;
; check.py verifies:
;   1. the same closed-form v(x) oracle as standard/body-force (trajectory
;      physics must be untouched by the extra accumulator slots);
;   2. the TOTAL y-momentum source = drag reaction ONLY: sum(Fy) over cells
;      = sum_p mdot_p*(g_y*t_res - v_y,out) — the correction must strip the
;      body-force-gained momentum from the gas deposit (closed forms for
;      t_res = Lx/u_g and v_out = v_inf*(1-e^(-t_res/tau)));
;   3. euler.tec sanity: finite everywhere, density/np >= 0.
;
; See standard/body-force/input.ini for the full physics derivation.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
body-accel  = 0.0 -200.0 0.0

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

