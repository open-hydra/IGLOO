; rot-2blk: an ATLAS two-block boundary file whose block interface has a non-identity orientation.
;
; The drag-stokes box (60 x 5 x 5 cells) as two blocks of 30 cells joined at x = 0.075 m, block 2 rotated 180
; degrees about the y axis (its i runs along -x, its k along -z): block 1's face 2 meets block 2's face 2, cell
; (30, j, k) against cell (30, j, 6 - k), orientation 1 0 0 -1. The gas temperature rises along z (2000 K/m) and
; the parcels start at kT = 0.5, so each row deposits its own energy and a k-mirror error is visible. The
; dispersed-phase boundary file INPUT/drop-bc.txt is ATLAS BCB's output on the deck INPUT-atlas/ (make_fixture.sh);
; [IGLOO-General] phase = drop names INPUT/drop-{phase.txt,properties.dat,bc.txt} and prefixes the outputs.
; check.py holds the run to the same box as one block (INPUT-1blk/, this input.ini without phase).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
phase       = drop
gas-order   = 1
out-file    = ALL
print-dcell = 1

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
