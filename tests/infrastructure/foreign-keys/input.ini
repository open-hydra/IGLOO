; IGLOO end-to-end check: a key IGLOO tests for presence, set only in a section that is not IGLOO's,
; is not read.
;
; drag-stokes's deck (INPUT is drag-stokes's) with a [decoys] section appended last, named freely as an
; ATLAS patch section is: it holds every key IGLOO tests for presence on the boundary injection path, each
; with a valid value. IGLOO reads these keys from its own [IGLOO-*] sections only, so this run must equal
; the deck cut at [decoys] (check.py runs that into ref-plain/).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

; the last section: check.py cuts the file at its header
[decoys]
body-accel = 0.0 0.0 -9.81
probe-ids  = 3
plane-x    = 0.05
psat       = 1.0e5
Mv         = 18.0
Lv         = 2.26e6
cpv        = 1900.0
Le         = 1.0
Yinf       = 0.0
sigma      = 0.072
mu         = 1.0e-3
x          = 0.01
y          = 0.025
z          = 0.025
