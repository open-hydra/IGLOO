; two-fam-bc-2blk-ord2-dual-default: two-fam-bc-2blk-ord2-dual (INPUT/ symlinked) with every default
; of the field output, the mollifier on (8 passes, which cross the 101 face through the halo).
;
; The box as two blocks of unequal cells (30 of 2 mm and 30 of 3 mm along x, 5 x 5 across) joined by a
; 101 face at x 0.06 m, gas-order 2, T rising by 1000 K per metre along x, two populations of material A
; injected at alpha 0.5 and beta 0.3 rad. check.py holds the smoothed source and eulerian fields to the
; same cells run as one block.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
out-file    = ALL
print-dcell = 1

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
