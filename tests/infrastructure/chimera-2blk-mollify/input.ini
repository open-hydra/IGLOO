; chimera-2blk-mollify: chimera-2blk's case (INPUT symlinked: two blocks overlapping by 8 cells, joined by
; chimera (102) faces with one donor of weight 1 per facelet) with the field mollifier at its default (8
; binomial passes). The overlap's deposits reach both blocks and the smoothing crosses each chimera face
; through the donor halo, so each block's fields must equal the box run as one block on its cells.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
out-file    = ALL
print-dcell = 1

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
