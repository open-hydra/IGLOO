; IGLOO end-to-end verification: TRANSLATIONAL PERIODIC BC (bcdef 201) on a ONE-LAYER box.
;
; periodic-y's case (the same physics, inputs and oracle) on a planar single-layer box of 60 x 25 x 1
; cells (tools/make_box_case.py --nz 1 --ny 25 --periodic-y --kv 1.0): the mesh is 2D (mesh2D), and
; each 201 record's connection line is ATLAS's single-layer form, nine integers: block, i, j, k (= 1),
; the partner face and the four orientation integers. The partner face is the fifth integer; the
; transport T = partner_center - exit_center = -+Ly*yhat needs it.
;
;   tau   = rho_p d^2/(18 mu) = 1.287e-3 s
;   v_inf = g_y*tau = -10.30 m/s ;  residence = Lx/u_g = 0.015 s
;   total drift ~ v_inf*(t_res - tau) = -0.141 m = 2.8 wraps of Ly = 0.05 m

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
body-accel  = 0.0 -8000.0 0.0

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
