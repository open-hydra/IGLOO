; IGLOO end-to-end verification: TRANSLATIONAL PERIODIC BC (bcdef 201) on a BOX.
;
; Same decoupled body-force physics as standard/body-force (kV=kT=1, Stokes
; exact-linear drag, transverse g), but with g_y strong enough that every
; particle drifts across the y-extent SEVERAL times, and faces 3/4 (y-min/y-max)
; made a translational periodic pair (bcdef 201 + connection lines,
; tools/make_box_case.py --periodic-y).
;
;   tau   = rho_p d^2/(18 mu) = 1.287e-3 s
;   v_inf = g_y*tau = -10.30 m/s ;  residence = Lx/u_g = 0.015 s
;   total drift ~ v_inf*(t_res - tau) = -0.141 m = 2.8 wraps of Ly = 0.05 m
;
; What 201 must do (obj_particles updateCell -> periodicTransport): translate the
; particle from the exit face to the partner face by T = partner_center -
; exit_center = -+Ly*yhat with VELOCITY UNCHANGED, then relocate in the block.
; check.py verifies:
;   1. v_y(x) follows the SAME closed form as standard/body-force across all
;      wraps (any velocity mangling at transport breaks the exponential);
;   2. y(x) equals the unwrapped closed form MODULO Ly (transport = exact -+Ly);
;   3. >= 2 wraps actually happen (non-vacuous), all particles exit at x = Lx;
;   4. u == u_g, w == 0, T == T_g guards (decoupling intact through transports).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
body-accel  = 0.0 -8000.0 0.0

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = per
face4 = per
face5 = wall
face6 = wall

[per]
type = periodic

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

