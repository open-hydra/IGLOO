; IGLOO end-to-end verification: a 103 face (connected interface, header only) on the outlet.
;
; drag-stokes's box, gas and parcels (INPUT/solfile.tec is drag-stokes's) with the outlet face (x = 0.15) coded
; 103 in bc.txt (tools/make_box_case.py --outlet-code 103): the record carries no payload line, so no partner
; cell is named and the face is not connected; a parcel reaching it leaves as through a 400 outlet. The file
; holds a face code of the connected family, so the run prints the block-change line. check.py runs the same
; input.ini on drag-stokes's INPUT/ (outlet 400) and holds this run to it.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
