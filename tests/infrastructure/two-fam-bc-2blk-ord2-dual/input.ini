; two-fam-bc-2blk-ord2-dual: the box as two blocks of unequal cells joined by a 101 face, gas-order 2,
; two populations injected at an angle, so that no parcel rides a dual-node line at the face.
;
; INPUT/ is tools/make_box_case.py --blocks 2 --families 2 --stretch 1.5 --gradient 1000 --alpha 0.5
; --beta 0.3: block 1 holds 30 cells of 2 mm along x (x 0..0.06 m), block 2 30 cells of 3 mm
; (x 0.06..0.15 m), 5 x 5 cells across; uniform gas (rho 1.2, U 10) but T rising by 1000 K per metre
; along x. Two populations of material A, one parcel per inlet cell each, injected at alpha 0.5 and
; beta 0.3 rad. check.py holds the source and both eulerian fields, the face columns included, to the
; same cells run as one block.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
out-file    = ALL
print-dcell = 1
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
