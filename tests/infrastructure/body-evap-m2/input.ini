; body-evap-m2: d2law-line's evaporating droplets (ODE model 2, a 100x cp that freezes B_T) under a body
; acceleration of -200 m/s^2 along y, with both output fields: the gas source must carry the reaction of
; the drag only, the body force's share of the momentum and energy taken out through the accumulators
; J = int m dt and W = int m g.v dt of the evaporating drop. check.py telescopes the trajectory rows
; against source.tec and runs a sibling with out-file = S (ref-S/), whose slot layout differs.
; time-end stops every parcel mid-cell before any reaches a wall: its last trajectory row is its
; final state.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = ALL
out-time    = on
body-accel  = 0.0 -200.0 0.0
time-end    = 6.875e-3

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = d2-law

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.0e5
Mv    = 100.0
Tboil = 900.0
cpv   = 2000.0
Le    = 1.0
Yinf  = 0.0
psat  = 1.0e4

[GPB-Phase1]
; ATLAS GPB regenerates INPUT/{phase.txt,properties.dat} from this section (committed as static fixtures)
material = A
type = condensed-dispersed
rho  = 8000
cp   = 125000

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0

