[IGLOO-General]
gas-file = INPUT/solfile.tec
gas-order = 2
print-dcell = 1
out-file = e

[IGLOO-Models]
drag = Stokes
heat = Kavanau-Drake

; Three DB-injected parcels in the mid-plane (z 0.0025) of a 0.5 x 0.1 x 0.005 m slab with ONE
; cell across z (mesh2D). The gas is uniform, u 5 and v -0.5, i.e. aimed at the y 0 wall at a
; tenth of the axial speed; the parcels start at the gas velocity, so they ride it down.
; Under the ord2 dual the wall row is the band y in [-2.5, +2.5] mm, sampled between the ghost
; node and the first interior node. With a bc-blind ghost the gas keeps v -0.5 all the way to
; y 0 and all three parcels reach the wall, at x 0.37, 0.42, 0.47 m. With the 301 mirror the
; sampled v_y is linear through zero at the plane and each parcel decays as exp(-40 x) instead.
; The injection heights 36, 41, 46 mm sit off every dual node plane (2.5 + 5k mm) and leave
; exit heights above 4e-6 m, well clear of the ODE atol and of the print floor.
; No '-equals-' inside a ';' comment line: this checkout's FiNeR parses it as an option.
[IGLOO-BC]
x    = 0.010 0.010 0.010
y    = 0.036 0.041 0.046
z    = 0.0025 0.0025 0.0025
diam = 4.0e-6 4.0e-6 4.0e-6
mdot = 1.0e-6 1.0e-6 1.0e-6
up   = 5.0 5.0 5.0
vp   = -0.5 -0.5 -0.5
wp   = 0.0 0.0 0.0

[GPB-Phase1]
type = condensed-dispersed
rho = 2500
cp = 1250

; Face 3 (y 0) is the wall the parcels approach; ATLAS tags a wall 301 for a dispersed phase,
; which is what IGLOO reads. Face 2 (x max) is the outlet; faces 5/6 are the slab planes, which
; both ghost fills skip in a 2D mesh.
[BCB-Block1]
face1 = extrapolation
face2 = extrapolation
face3 = wall
face4 = extrapolation
face5 = symmetry
face6 = symmetry
