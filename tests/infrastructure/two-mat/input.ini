; IGLOO end-to-end verification: UNIFORM gas + Stokes drag on an AXIS-ALIGNED BOX.
;
; The gas field (INPUT/solfile.tec, generated by tools/make_box_case.py) embeds a
; 3D box mesh (x[0,0.15] y[0,0.05] z[0,0.05], 60x5x5 cells) carrying a spatially
; uniform gas: rho=1.2, U=10, V=W=0, T=600, mu=1.8e-5. Particles inject from face 1
; (x=0 inlet, 25 cells) with kV=0.1 => v0 = kV*|u_g| = 1 m/s in the gas direction
; (1,0,0); with V=W=0 the motion is purely axial and the x-velocity relaxes by the
; exact Stokes solution v(t)=u_g+(v0-u_g)e^{-t/tau}, tau=rho_p d^2/(18 mu). check.py
; verifies the closed-form x(v) relation per particle (anchored at its first point).
;
; A BOX (not the production nozzle mesh) is used on purpose: on the nozzle, FB
; injection mis-places most inlet particles into the domain interior (see
; tests/FINDINGS.md). The axis-aligned box makes injection-placement
; geometry trivial, so particles land on the inlet plane and the case runs in
; seconds. Drag=Stokes forces Cd=24/(Re+toll) => Fdrag=3*pi*mu*d*vrel exactly, so
; the closed form holds by construction (Ma/Tr do not enter). No evaporation/breakup
; keys => model 1 (drag+heat). gas-order=1 (cell value read directly). out-file=S
; (euler off => neq=7; one-way coupled so the trajectory is identical either way).
; dx=2.5mm << relaxation length L=u_g*tau=1.29cm => ~10 points in the relaxation
; window. ODE tol 1e-11 keeps the integrator ~3 orders below the F12.6 floor (5e-7),
; so the output truncation, not the integrator, sets the achievable accuracy.

; two-mat: the SAME box, gas, inlet and parcels as drag-stokes, integrated for TWO materials.
; Nothing in the suite had ever run with more than one material (nm = 2): the per-material
; loops in solve, the material index of sourceMass, nfam = 2 (euler1/euler2), the
; per-material output files and the famID-keyed RNG streams all execute here for the first
; time. phase.txt lists A and B; properties.dat carries two zones, A at rho 2950 (drag-stokes)
; and B at rho 1000, so the two materials relax on different Stokes times and each
; trajectories-<mat>.dat has its own closed-form curve. bc.txt is drag-stokes' -- one
; property line per inlet cell, applied to EVERY family, so both materials inject the same
; parcels (dp, v0, krho) and differ only through their density. out-file is deliberately
; omitted: the default enables BOTH the source and the eulerian output (the solver prints a
; 'not recognized or not given' warning for it -- ledger O21), so source.tec carries two
; wdot slots and euler1/euler2.tec are written, one per family.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[GPB-Phase2]
type = condensed-dispersed
rho  = 1000
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

