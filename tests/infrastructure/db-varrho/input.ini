; db-varrho: four database streams without temp0 and without a velocity on a density table. INPUT/solfile.tec is
; make_box_case.py's box with --gradient 1000 (gas temperature 600 + 1000 x at the cell centres, 10 m/s along x);
; INPUT/properties.dat is temp-relax-varrho's table (density linear in T). Each stream sits at a cell centre and is
; injected at its cell's gas velocity and temperature; the scatter pre-pass sizes the quantum from that state.
; See INFO.md.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x    = 0.01125 0.05125 0.09125 0.13125
y    = 0.025
z    = 0.025
diam = 11.89e-6
mdot = 1.0e-4

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
