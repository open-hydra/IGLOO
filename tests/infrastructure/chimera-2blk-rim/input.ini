; chimera-2blk-rim: chimera-2blk with block 2 one cell row shorter in y -- a partly covered overlap.
;
; INPUT/ is tools/make_box_case.py --blocks 2 --overlap 4 --rim --families 2: block 1 holds cells 1..34 of
; the 60-cell line (5 x 5 rows), block 2 cells 27..60 with 4 rows in y (y 0..0.04 m). Face 2 of block 1
; (x 0.085 m) is a chimera face (102) where block 2 lies behind it; its five facelets of the uncovered row
; (y 0.04..0.05 m) have no donor and are written 100, ATLAS's unresolved connection. The parcels of that
; row leave the domain there: rim exits.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
out-file    = ALL
print-dcell = 1
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
