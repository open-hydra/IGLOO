; inj-edge-payload: drag-stokes's box (solfile symlinked) with its own INPUT/bc.txt (make_bc.py): the inlet
; rows m 1 and 3 carry krho 0.68 and kV 0.2 (the others 0.34 and 0.1), and row m 2 a per-cell spacing of
; 2.5 mm (bc column 9), so that its advancing front puts lattice points on the edges it shares with rows 1
; and 3. Every parcel must carry the payload of the inlet cell that pinned it. The global ds puts one
; parcel at the centre of each cell of the other rows.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
