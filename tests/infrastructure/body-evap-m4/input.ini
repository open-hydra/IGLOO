; body-evap-m4: d2law-brk-dormant's drops (ODE model 4: d2-law evaporation with the Reitz-Diwakar
; breakup rate held at zero) under a body acceleration of -200 m/s^2 along y, with both output fields:
; the gas source must carry the reaction of the drag only, the body force's share taken out through
; J = int npdot m dt (the Eulerian mass slot when the Eulerian output is on) and W = int npdot m g.v dt.
; check.py telescopes the trajectory rows against source.tec and runs a sibling with out-file = S (ref-S/).
; time-end stops every parcel mid-cell before any reaches a wall: its last trajectory row is its
; final state.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = ALL
out-time    = on
body-accel  = 0.0 -200.0 0.0
time-end    = 6.875e-3

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = d2-law
breakup     = Reitz-Diawakar

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3
Lv    = 2.0e5
Mv    = 100.0
Tboil = 900.0
cpv   = 2000.0
Le    = 1.0
Yinf  = 0.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 8000
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 30.0e-6

[wall]
type = wall
q    = 0.0
