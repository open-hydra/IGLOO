; IGLOO end-to-end check: a key IGLOO tests for presence on the assigned-position (DB) injection path, set
; only in a section that is not IGLOO's, is not read.
;
; db-injection's deck (INPUT is db-injection's) with [IGLOO-BC] holding the positions, diam and mdot only,
; and a [decoys] section appended last holding the optional DB keys temp0, up, vp and wp, each with a valid
; value. IGLOO reads these keys from [IGLOO-BC] only, so this run must equal the deck cut at [decoys]
; (check.py, shared with foreign-keys, runs that into ref-plain/).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.01 0.01 0.01 0.01 0.01
y     = 0.005 0.015 0.025 0.035 0.045
z     = 0.025
diam  = 11.89e-6
mdot  = 1.0e-4

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

; the last section: check.py cuts the file at its header
[decoys]
temp0 = 400.0
up    = 3.0
vp    = 0.5
wp    = 0.5
