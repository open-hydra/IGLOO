; IGLOO end-to-end verification: injection placement -- the packing of several parcels per inlet cell.
;
; drag-stokes's box and gas with ds = 0.27 cm against the 1 cm inlet cells: the 3D placement packs each cell by an
; advancing front (a hexagonal lattice at the spacing R = ds, a candidate refused within R/2 of a placed point).
; Rows j = 1-4 are 401, row 5 is 402 (gp = 5.0, make_fixture.py), so the 402 mass flow is shared by several
; parcels. check.py gates the placement (inlet plane, spacing) and the mass flow per cell.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 0.27

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
