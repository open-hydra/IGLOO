; solver-fail-consumed: a parcel deleted because the ODE solver gave up must still hand
; its remaining mass to the gas (consumption models 2/5) -- the `err < 0` exit of
; Lib_Integration, which is reached by no other fixture.
;
; Byte copy of tests/evaporation/tc-hexadecane/input.ini with ONE change: the ODE
; tolerances are set to 1e-30, below what double precision can ever resolve, so SDIRK4
; fails on the first step of every parcel and Run_ODESolver returns err < 0. The failure
; is structural, not marginal: no compiler or OSlo version can satisfy atol = 1e-30, so
; the path fires deterministically.
;
; The parcels therefore die at injection carrying their FULL mass. That makes the gate
; maximal -- sum(wdot) is either the whole injected stream (contract honoured) or exactly
; zero (remnant dropped) -- and it also shows the cost of the contract: the deposited
; remnant is not necessarily small. Here it is 100 % of the stream, spread over the
; injection cells by mollification. The alternative contract (drop the remnant) is one
; line in Lib_Integration and would make this gate read 0.
;
; Everything below is tc-hexadecane's own header and case; the physics is gated there.
;
; E-VAL-3: Tonini-Cossali evaporation reproducing TC2012 Fig. 11 -- an n-hexadecane
; drop (R_d0=10um, T_d0=300K) in vapour-free air at 600K. Same box and injection as
; tc-box (kv=1 gives Re=0, Sh=2, coast at u_g, t=x/u_g; kt=0.5 gives 300K; d0=20um),
; but a REAL fuel with temperature-dependent liquid density (INPUT/properties.dat),
; so the drop swells while heating before the D2-law evaporation. Evaporation=TC,
; interface=VLE. The Stefan-Fuchs rate is the tight gate (check.py); the digitized
; TC2012 Fig.11 curves are a non-gating overlay (verify.py). n-hexadecane properties
; (Tier-1 reconstruction, 2026-07-28): Mv, Tboil from TC2012 Table 1; Lv=2.58e5 = the
; effective latent heat of the paper's own Table-1 psat curve (CC slope through its
; (T,Pvs/PN) anchors ~ Watson Lv at the ~490K wet-bulb); liquid cp_l=2800 (properties.dat)
; = NIST/Chemeo n-hexadecane liquid Cp at ~490K (298K value 2205 was the earlier error).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-30
absolute-tol = 1e-30

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = TC
interface   = VLE

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.58e5
Mv    = 226.45
Tboil = 560.0
cpv   = 2300.0
Le    = 2.5
Yinf  = 0.0
psat  = 1.0e4

[GPB-Phase1]
type    = condensed-dispersed
rho     = 8000
cp      = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 20.0e-6

[wall]
type = wall
q    = 0.0

