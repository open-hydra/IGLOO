; IGLOO end-to-end verification: particle inlets 402 and 403.
;
; drag-stokes's box and gas (INPUT/solfile.tec is drag-stokes's) with the inlet rows recoded by make_fixture.py:
; rows j = 1-2 are 402 (column 1 the particle mass flux gp = 5.0 kg/(m^2 s), column 2 the absolute speed
; 4.0 m/s, column 5 the absolute temperature 450 K), rows j = 3-5 are 403 (gp = 2.0, column 2 a factor on the
; gas speed, 0.5, Tp = 350 K); direction 'normal' (the gas direction). One parcel per inlet cell (ds = 10 cm).
; check.py holds the injection state and the exit mass flow to these inputs and the relaxation to the Stokes
; closed form.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
