; sym-plane-hop: parcels bouncing in place on a symmetry plane in a gas at rest, at gas order 1 (the reflection's crossing).
;
; INPUT/solfile.tec is stuck-cell's, the box tools/make_box_case.py --sym-face 5 --no-inlet --ug 0.0 writes:
; drag-stokes's box with the gas at rest, T 600 K; INPUT/bc.txt is sym-plane-skate's (face 5, z 0, a symmetry
; plane, code 300; no inlet). Three assigned streams at x 0.004 m, y 0.015, 0.025, 0.035 m, z 5e-5 m, at rest
; along the plane and falling at 0.02, 0.05 and 0.08 m/s under a body acceleration of 9.81 m/s2 onto it, Stokes
; drag, at the gas temperature. Each parcel bounces in place, its hops shrinking below the solver's steps, until
; the stuck-bounce guard ends it at its 100th reflection. print-dtime 1e-300 writes a row at every segment end.
; check.py: the 100th reflection at the closed form's time, a row per reflection with its time increasing, every
; rebound leaving the plane.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dtime = 1e-300
out-file    = S
out-time    = on
body-accel  = 0.0 0.0 -9.81

[IGLOO-ODE]
ode-solver = H-sdirk4

[IGLOO-Models]
drag = Stokes
heat = NoHeat

[IGLOO-BC]
x     = 0.004
y     = 0.015 0.025 0.035
z     = 5.0e-5
up    = 0.0 0.0 0.0
vp    = 0.0 0.0 0.0
wp    = -0.02 -0.05 -0.08
diam  = 11.89e-6
mdot  = 1.0e-4
temp0 = 600.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = wall
face2 = out
face3 = wall
face4 = wall
face5 = sym
face6 = wall

[out]
type = outlet

[wall]
type = wall
q    = 0.0

[sym]
type = symmetry
