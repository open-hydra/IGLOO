; inj-edge: drag-stokes's box (INPUT symlinked) with the injection spacing ds = 0.25 cm. The 3D advancing
; front seeded at each inlet cell's centre puts lattice rows on the cell edges y = k cm, the domain's outer
; edge y 0 included, where rounding leaves the point a few 1e-18 m outside the face. Every parcel must take
; its own inlet cell and leave at x 0.15 m.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 0.25

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
