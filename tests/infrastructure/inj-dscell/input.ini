; IGLOO end-to-end verification: injection placement -- a cell's own spacing (bc.txt column 9) over the global ds.
;
; drag-stokes's box, gas and inlet (401) with [IGLOO-BC] ds = 10 cm (one centred parcel per 1 cm cell) and, on rows
; j = 1-2 only, the payload's column 9 = 2.7e-3 (make_fixture.py): column 9 is the cell's spacing in metres and
; overrides the global ds (in cm), so those ten cells are packed at R = 2.7 mm and the other fifteen take one parcel.
; check.py gates the two populations, the placement and the mass flow per cell.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
