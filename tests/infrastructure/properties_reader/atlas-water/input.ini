; test_properties_reader fixture: water (mhb98-water's [IGLOO-Properties], Tboil 373.15 K) for the
; table ATLAS GPB writes with psat-vapour = H2O (INPUT/atlas-*, its bytes unchanged). Lv, Mv and cpv
; come from the table's columns, so they are not keys here.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
interface   = VLE

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Tboil = 373.15
Le    = 1.0
Yinf  = 0.0
