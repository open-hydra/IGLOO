; test_properties_reader fixture: two evaporating water-like materials (A, B) whose boiling points are given
; away from one atmosphere. Material A by Clausius-Clapeyron, 393.15 K at 2e5 Pa (zone A of
; INPUT/bp-properties.dat all zero); material B with a Psat column through 406.7 K at 3 atm.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.26e6 2.26e6
Mv    = 18.0 18.0
boiling-temperature = 393.15 406.7
boiling-pressure = 2.0e5 303975.0
cpv   = 1900.0 1900.0
Le    = 1.0 1.0
Yinf  = 0.0 0.0
