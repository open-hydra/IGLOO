; test_properties_reader fixture: two n-hexadecane materials (A, B), one value per material in
; [IGLOO-Properties]; zone A of INPUT/nm-properties.dat carries a Psat curve, zone B zeros.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = TC
interface   = VLE

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.58e5 2.58e5
Mv    = 226.45 226.45
Tboil = 560.0 560.0
cpv   = 2300.0 2300.0
Le    = 2.5 2.5
Yinf  = 0.0 0.0
