; test_properties_reader fixture: tc-hexadecane's INI (n-hexadecane, Tboil 560 K, evaporation TC).
; Only [IGLOO-*] is read; the tables are INPUT/<prefix>properties.dat, read one prefix at a time.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = TC
interface   = VLE

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.58e5
Mv    = 226.45
Tboil = 560.0
cpv   = 2300.0
Le    = 2.5
Yinf  = 0.0
