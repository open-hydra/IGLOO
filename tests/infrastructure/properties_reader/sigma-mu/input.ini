; test_properties_reader fixture: two water materials (A, B) that break up (TAB). Zone A of
; INPUT/sm-properties.dat carries Sigma and Viscosity columns, zone B zeros: A takes the columns
; (its [IGLOO-Properties] entries are 0, not given), B the [IGLOO-Properties] constants.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
breakup     = TAB

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0 0.05
mu    = 0 1e-3
