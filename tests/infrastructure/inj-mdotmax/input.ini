; IGLOO end-to-end verification: injection placement from a cap on the parcel's mass flow.
;
; drag-stokes's box, gas and 401 inlet (INPUT symlinked) with no ds and mdot-max 0.25 g/s: each 1 cm inlet cell
; carries 0.618 g/s, so the placement asks for at least 3 parcels per cell and packs the cell at the spacing
; d_cell/3, whose lattice reaches the face-cell edges. check.py gates the cap, the placement and the mass flow
; per cell.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on
mdot-max    = 0.25

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 0.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
