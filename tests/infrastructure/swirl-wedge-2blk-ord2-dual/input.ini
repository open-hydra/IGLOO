; swirl-wedge-2blk-ord2-dual: swirl-wedge's annular wedge as two blocks of unequal cells along x
; joined by a 101 face, gas-order 2, mollify off.
;
; INPUT/solfile.tec and bc.txt are tools/make_wedge_case.py --blocks 2 --stretch 1.5: the 1 degree
; wedge of swirl-wedge (x 0..2 m, r 0.19..0.99 m, 40 cells along r, one along the azimuth), block 1
; 100 cells of 8 mm along x, block 2 100 cells of 12 mm, the face at x 0.8 m; U 1 and the solid-body
; swirl W linear in y (omega 0.2 rad/s). phase.txt and properties.dat are swirl-wedge's (symlinked).
; swirl-wedge's three DB parcels with parcel 2 at y 0.505, off the radial dual-node lines at the face.
; out-file ALL writes the source and eulerian fields; check.py runs swirl-wedge's oracle on this run
; and holds both fields to the same cells run as one block.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file    = ALL
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.105 0.105 0.105
y     = 0.5 0.505 0.3
z     = 0.0 0.0 0.0
up    = 1.0 1.0 1.0
vp    = 0.0 0.0 0.0
wp    = 0.1 0.0 0.12
diam  = 6.0e-4 6.0e-4 6.0e-4
mdot  = 1.0e-4 1.0e-4 1.0e-4
temp0 = 300.0 300.0 300.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 1800
cp   = 1250
