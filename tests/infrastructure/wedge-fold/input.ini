[IGLOO-General]
gas-file = INPUT/solfile.tec
print-dcell = 1
out-file = e

[IGLOO-Models]
drag = Morsi-Alexander
heat = Kavanau-Drake

; Same two DB parcels and the same nozzle field as axis-200, plus an azimuthal (swirl)
; injection velocity on the near-axis parcel. With a nonzero wp the parcel leaves the
; 1-degree wedge sector within its first ODE segment, so the 200-face fold (position AND
; velocity rotated back into the sector) is exercised. Nothing else in the suite has a
; nonzero z on a wedge, so this is the only case in which the fold rotates anything.
;   ID 1 -- near-axis, r0 of 1e-4, wp of 0.5 (about 5000 rad/s about the axis at
;           injection; drag relaxes it toward the swirl-free gas as it spirals out)
;   ID 2 -- off-axis control, no wp; it must be identical to axis-200's ID 2.
; Ledger O22: before the fix the fold rotated the wrong way and walked ID 1 to the far
; side of the axis, where it 2-cycled with zero advance until outer maxIter (500000).
; INI traps as in axis-200: single-space separated values, no '-equals-' in comments.
[IGLOO-BC]
x = -0.49 -0.49
y = 1.0e-4 0.55
diam = 2.0e-5 2.0e-5
mdot = 1.0 1.0
up = 78.858149 7.521874
vp = -1.0 -3.349168
wp = 0.5 0.0

[GPB-Phase1]
type = condensed-dispersed
rho = 2500
cp = 1250

; face3 is the axis. db-2daxi tags it `sym` (-> bcdef 300); this case tags it
; `axisymmetric` (-> bcdef 200), which is what ATLAS emits for `axisymmetric` and what
; the JPL nozzle cases use. bc.txt is db-2daxi's with the 200 face-3 entries retagged.
[BCB-Block1]
face1 = in
face2 = out
face3 = axisymmetric
face4 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.5
dp = 20e-6

[wall]
type = wall
q = 0.0
