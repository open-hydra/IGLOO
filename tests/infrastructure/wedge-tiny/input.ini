; IGLOO end-to-end gate: a single-layer sector of 5e-7 rad is a PLANAR single layer, not a wedge.
;
; The gas field (INPUT/solfile.tec, tools/make_wedge_case.py --delthe-deg 2.8647890e-05 --omega 0)
; is swirl-wedge's annular mesh (x[0,2] x r[0.19,0.99], 200x40 cells, one cell in the azimuth) with
; the two k-planes 5e-7 rad apart and no swirl: U 1, V 0, W 0. A sector at or below 1e-6 rad is
; classified planar (the fold's slack nears roundoff there), so the log carries the tiny-sector
; notice and the planar line, and no wedge line.
; The three DB parcels of swirl-wedge (cell centres, theta 0) with no azimuthal velocity: up 1 at
; the gas velocity, so every parcel stays on its injection line and leaves at the outlet x 2.
; INI traps: single spaces between values; no equals sign inside comment lines.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.105 0.105 0.105
y     = 0.5 0.5 0.3
z     = 0.0 0.0 0.0
up    = 1.0 1.0 1.0
vp    = 0.0 0.0 0.0
wp    = 0.0 0.0 0.0
diam  = 6.0e-4 6.0e-4 6.0e-4
mdot  = 1.0e-4 1.0e-4 1.0e-4
temp0 = 300.0 300.0 300.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 1800
cp   = 1250

[BCB-Block1]
face1 = out
face2 = out
face3 = wall
face4 = wall
face5 = axisymmetric
face6 = axisymmetric

[out]
type = outlet

[wall]
type = wall
q    = 0.0
