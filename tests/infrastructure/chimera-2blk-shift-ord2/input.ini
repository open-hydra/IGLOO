; chimera-2blk-shift-ord2: chimera-2blk's overlapping blocks with block 2 shifted by half a cell, gas-order 2.
;
; INPUT/ is tools/make_box_case.py --blocks 2 --overlap 4 --shift 0.5 --families 2 --gradient 1000: block
; 1 holds cells 1..34 of the 60-cell line (x 0..0.085 m), block 2 34 cells from x = 0.06625 m to 0.15125 m,
; joined by chimera (102) faces at x = 0.085 (block 1) and 0.06625 (block 2) with ATLAS's donor payload;
; uniform gas (rho 1.2, U 10) but T = 600 + 1000 x K in both blocks. Two populations of material A. Under
; gas-order 2 the ghost nodes of each 102 face are interpolated from the other block's gas, between two of
; its centres.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
out-file    = ALL
print-dcell = 1
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
