; chimera-2blk: drag-stokes's box as two OVERLAPPING blocks joined by chimera (102) faces.
;
; INPUT/ is tools/make_box_case.py --blocks 2 --overlap 4 --families 2: block 1 holds cells 1..34
; of the 60-cell line, block 2 cells 27..60 (x 0.065..0.15 m), uniform gas (rho 1.2, U 10, T 600).
; Face 2 of block 1 (x 0.085 m) and face 1 of block 2 (x 0.065 m) are 102 faces; each facelet's
; payload is ATLAS's: the donor counts of the two ghost layers, then one line per donor (block, i,
; j, k, volume weight), one donor of weight 1 per layer here. The face tables are written once per
; family in ATLAS's order (two populations of material A), so every copy repeats the payload.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
out-file    = ALL
print-dcell = 1
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
