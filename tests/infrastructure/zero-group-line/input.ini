; IGLOO end-to-end check: a 0-group material line that no product names is an inert material, named in the log.
;
; drag-stokes's deck with its own INPUT/phase.txt (A 1, B 0): material B has no group and no burning line names
; it as its product. Its zone of properties.dat is two-mat's second zone (bc.txt and solfile.tec are
; drag-stokes's). B injects nothing: A's records and the source equal the plain drag-stokes run's, B's files
; hold no data row, and the setup log carries one line naming B as inert (check.py).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
