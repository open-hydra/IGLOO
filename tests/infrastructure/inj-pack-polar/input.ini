; IGLOO end-to-end verification: injection placement -- the packing of an annular-sector inlet.
;
; drag-stokes's box and gas with its cross-section mapped to an annular sector (r 4-7 cm, theta 0-60 degrees,
; 6 radial x 12 azimuthal cells, make_fixture.py) and ds 0.25 cm against the 5 mm inlet cells: the 3D placement
; packs the face by an advancing front whose cells' first edges turn by 5 degrees from one column of cells to the
; next. check.py gates one hexagonal lattice over the whole face (the spacing, the lattice, its nodes all pinned)
; and the mass flow per cell.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 0.25

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
