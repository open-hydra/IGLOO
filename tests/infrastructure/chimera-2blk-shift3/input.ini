; chimera-2blk-shift3: chimera-2blk's overlapping blocks with block 2 shifted by 0.3 of a cell, unsmoothed.
;
; INPUT/ is tools/make_box_case.py --blocks 2 --overlap 4 --shift 0.3 --families 2: block 1 holds cells
; 1..34 of the 60-cell line (x 0..0.085 m), block 2 34 cells from x = 0.06575 m to 0.15075 m, joined by
; chimera (102) faces at x = 0.085 (block 1) and 0.06575 (block 2), two donors of weights 0.3 and 0.7 per
; facelet; uniform gas (rho 1.2, U 10, T 600). Two populations of material A.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
out-file    = ALL
print-dcell = 1
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
