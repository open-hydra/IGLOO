; IGLOO end-to-end verification: injection placement -- the degeneracy floor ds-degen.
;
; drag-stokes's box with its rows along y of geometric thickness, each twice the one below (make_box_case.py
; --ygrade 2: 1.61, 3.23, 6.45, 12.9 and 25.8 mm), the gas and the 401 inlet unchanged, ds = 10 cm (one centred
; parcel per cell) and ds-degen = 0.5 cm: no parcel is injected in a cell thinner than ds-degen along its face, so
; rows 1-2 inject nothing and rows 3-5 one parcel per cell. check.py gates the populations and the mass flow.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S
out-time    = on

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds       = 10.0
ds-degen = 0.5

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
