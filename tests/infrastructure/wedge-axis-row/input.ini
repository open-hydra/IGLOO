[IGLOO-General]
gas-file = INPUT/solfile.tec
print-dcell = 1
out-file = e

[IGLOO-Models]
drag = Morsi-Alexander
heat = Kavanau-Drake

; A 1-degree wedge about the x axis whose j 0 row is an axis row at r 1e-8 with z exactly 0
; (the layout ATLAS gives hydra's JPL nozzle). The slab/wedge classifier must not take that row
; for an off-axis node: its azimuth is roundoff. Two parcels in the meridian plane (z 0) at the gas
; velocity; the wedge fold and the 2.5D gas sampling stay active.
; No '-equals-' inside a ';' comment line: this checkout's FiNeR parses it as an option.
[IGLOO-BC]
x = 0.005 0.005
y = 0.01 0.03
z = 0.0 0.0
diam = 2.0e-5 2.0e-5
mdot = 1.0 1.0
up = 5.0 5.0
vp = 0.0 0.0
wp = 0.0 0.0

[GPB-Phase1]
type = condensed-dispersed
rho = 2500
cp = 1250

[BCB-Block1]
face1 = symmetry
face2 = extrapolation
face3 = axisymmetric
face4 = symmetry
face5 = axisymmetric
face6 = axisymmetric
