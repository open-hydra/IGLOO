; refusal gate: the surface tension given twice, as the Sigma column of properties.dat and as
; [IGLOO-Properties] sigma. pe-sigma-table's case (INPUT symlinked) with the key added.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = NoHeat
breakup     = Pilch-Erdman
Cd          = 0.5
B           = 0.0758

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0.072
