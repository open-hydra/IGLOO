; refusal gate: boiling-temperature and its alias Tboil given together in [IGLOO-Properties].
; The two names are one key; giving both is ambiguous and must stop the run at setup.
; Everything else is tc-box (INPUT symlinked).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = TC
interface   = VLE

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 1.0e6
Mv    = 100.0
boiling-temperature = 600.0
Tboil = 600.0
cpv   = 2000.0
Le    = 1.0
Yinf  = 0.0
psat  = 1.0e4

[GPB-Phase1]
type    = condensed-dispersed
rho     = 8000
cp      = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 20.0e-6

[wall]
type = wall
q    = 0.0

