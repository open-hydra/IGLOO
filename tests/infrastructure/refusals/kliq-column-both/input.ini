; refusal gate: liquid-conduction P2T with k-liq on the material line AND a Conductivity column.
; evaporation/temp-relax-p2t (k-liq=0.026, mu-liq=1.0e-3) with its own INPUT/properties.dat: the drop's range
; and a Conductivity column k_l = 0.026/450 T.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag              = Stokes
heat              = Ranz-Marshall
evaporation       = d2-law
liquid-conduction = P2T

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv                  = 2.26e6
Mv                  = 18.0
boiling-temperature = 373.15
cpv                 = 1900.0
Le                  = 1.0
Yinf                = 1.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
