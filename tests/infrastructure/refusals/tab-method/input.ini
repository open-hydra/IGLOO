; refusal gate (ledger O20): TAB method = 3 was accepted by the parser and reached a comment-only
; stub in TABmodel (rNew = 0, dp = 0, npdot divides by zero). Now refused at parse: method is 1 or 2.
; Everything else is tab-e2e (INPUT symlinked).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = TAB
method      = 3
n           = 3.5

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma = 0.072
mu    = 1.0e-3

[GPB-Phase1]
; ATLAS GPB regenerates INPUT/{phase.txt,properties.dat} from this section (committed as static fixtures)
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0

