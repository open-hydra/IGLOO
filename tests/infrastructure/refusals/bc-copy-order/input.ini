; refusal gate: two-fam-bc's two-copy bc.txt with two face-3 headers of copy 2 exchanged
; (make_fixture.py --swap). The codes still line up, so the payload lines stay in place; only the
; header integers say that copy 2 does not describe the faces of copy 1 in the same order.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[GPB-Phase2]
type = condensed-dispersed
rho  = 1000
cp   = 1250
