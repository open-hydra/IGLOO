; refusal gate: an axisymmetric wedge whose sector is NOT centred on the azimuth origin.
; INPUT/solfile.tec is tools/make_wedge_case.py --theta0-deg 0.5 --nx 4 --nr 4: the two
; k-planes sit at 0 and +1 deg instead of -+0.5 deg. IGLOO's fold band (axisymFold,
; abs(theta) at most delthe/2), the 2.5D gas sample (sampleGas2D) and the meridian-frame
; deposits (toMeridian) all take refDir as the sector CENTRE, the MOSE/ATLAS layout; on
; this mesh they would run with the gas and every deposit rotated by delthe/2, silently.
; allocation.f90 refuses it at mesh import, before any particle is placed.
; INI traps: single spaces between values; no equals sign inside comment lines.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.5
y     = 0.5
z     = 0.0
up    = 1.0
vp    = 0.0
wp    = 0.1
diam  = 6.0e-4
mdot  = 1.0e-4
temp0 = 300.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 1800
cp   = 1250

[BCB-Block1]
face1 = out
face2 = out
face3 = wall
face4 = wall
face5 = axisymmetric
face6 = axisymmetric

[out]
type = outlet

[wall]
type = wall
q    = 0.0
