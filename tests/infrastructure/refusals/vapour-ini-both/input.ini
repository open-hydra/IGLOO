; refusal gate: a latent heat given both as an [IGLOO-Properties] key and as the Lv column of properties.dat
; must stop the run at setup. mhb98-water-psat's case and table (ATLAS GPB, water with psat-vapour H2O, the
; Lv, Mv and Cpv columns beside Psat) with the key Lv 2.462478e6 kept.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
interface   = LK

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
Lv    = 2.462478e6
Tboil = 373.15
Le    = 1.0
Yinf  = 0.0

[GPB-Phase1]
type    = condensed-dispersed
rho     = 997
cp      = 4184

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 1.1e-3

[wall]
type = wall
q    = 0.0
