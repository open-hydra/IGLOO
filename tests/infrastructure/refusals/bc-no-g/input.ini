; refusal gate: a 401 inlet line without its 10th field G is refused: a bc.txt of an ATLAS before the mixture
; rule over the dispersed phases, whose field 1 is krho and not krho/(1 - krho_tot). drag-stokes's case with its
; bc.txt as that ATLAS wrote it (INPUT/bc.txt: 401 lines of nine fields, field 1 krho, no G).

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0
