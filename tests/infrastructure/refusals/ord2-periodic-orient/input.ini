; refusal gate: a box whose faces 3/4 are a periodic (201) pair at gas-order 2 (make_ord2.py), in which
; block 1's first 201 record carries the orientation -1 0 0 1: its face corners lie one cell from the
; partner's, modulo the periodic offset.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 2
print-dcell = 1
out-file    = S
mollify     = off

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
