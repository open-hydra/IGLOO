; refusal gate: liquid-conduction P2T on a breaking material that also gives mu-liq: the material has one
; liquid viscosity, the breakup one. breakup/khrt-evap-frozen (Reitz-KHRT, mu 1.0e-3) with its own
; INPUT/phase.txt (k-liq 0.6 and mu-liq 1.0e-3 on the material line) plus the key.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = Ranz-Marshall
breakup     = Reitz-KHRT
evaporation = d2-law
liquid-conduction = P2T

[IGLOO-BC]
ds = 10.0

[IGLOO-Properties]
sigma               = 0.072
mu                  = 1.0e-3
Lv                  = 2.26e6
Mv                  = 18.0
boiling-temperature = 373.15
cpv                 = 1900.0
Le                  = 1.0
Yinf                = 1.0

[GPB-Phase1]
material = A
type    = condensed-dispersed
rho     = 1000
cp      = 4182

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 0.6e-3

[wall]
type = wall
q    = 0.0
