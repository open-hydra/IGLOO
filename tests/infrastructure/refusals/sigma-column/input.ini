; refusal gate: a Sigma column with a negative surface tension (-0.01 N/m at 320 K) is refused.
; pe-sigma-table's case with that one row changed.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-9
absolute-tol = 1e-9

[IGLOO-Models]
drag        = Schiller-Naumann
heat        = NoHeat
breakup     = Pilch-Erdman
Cd          = 0.5
B           = 0.0758

[IGLOO-BC]
ds = 10.0
