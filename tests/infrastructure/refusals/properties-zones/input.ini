; refusal gate (ledger O24 residual): phase.txt lists two materials, properties.dat has ONE
; zone. Before 2026-09-16 this was a SIGSEGV at block(2) with no message.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250

[GPB-Phase2]
type = condensed-dispersed
rho  = 1000
cp   = 1250

[BCB-Block1]
face1 = in
face2 = out
face3 = wall
face4 = wall
face5 = wall
face6 = wall

[out]
type = outlet

[in]
type = inlet
krho = 0.34
dp   = 11.89e-6

[wall]
type = wall
q    = 0.0

