; refusal gate: phase.txt declares three families (A 3) but bc.txt carries two copies of the
; face table (two-fam-bc's file). One copy (1250 records) or one per family (3750) is readable;
; 2500 is neither, and the reader must stop with the counts instead of guessing.

[IGLOO-General]
gas-file    = INPUT/solfile.tec
gas-order   = 1
print-dcell = 1
out-file    = S

[IGLOO-ODE]
ode-solver   = H-sdirk4
relative-tol = 1e-11
absolute-tol = 1e-11

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds = 10.0

[GPB-Phase1]
type = condensed-dispersed
rho  = 2950
cp   = 1250
